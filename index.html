                      <div className="serif bold fs-13 mb-4">😮‍💨 Fadiga Intra-Ciclo · Ciclo {fadigaIntra.ciclo}</div>
                      <div className="mono fs-11 txt-muted mb-8">
                        Tempo por puzzle (média móvel) na ordem em que foram resolvidos · n={fadigaIntra.n}
                      </div>
                      <div style={{ height: 220 }}>
                        <GraficoCanvas tipo="line" data={fadigaIntra.data}
                          opcoes={{ ...optsBase, scales: { ...optsBase.scales, x: { ...optsBase.scales.x, ticks: { ...optsBase.scales.x.ticks, maxTicksLimit: 8 } } } }} />
                      </div>
                      <div className={'mono fs-11 mt-8 ' + (fadigaIntra.subiuPct > 20 ? 'txt-red' : (fadigaIntra.subiuPct > 0 ? 'txt-amber' : 'txt-green'))}>
                        {fadigaIntra.subiuPct > 20
                          ? '↑ Tempo subiu ' + fadigaIntra.subiuPct + '% do início ao fim — fadiga clara. Considere quebrar o ciclo em duas sessões.'
                          : (fadigaIntra.subiuPct > 0
                            ? '↑ Tempo subiu ' + fadigaIntra.subiuPct + '% — leve fadiga aceitável.'
                            : '↓ Tempo manteve-se ou caiu (' + fadigaIntra.subiuPct + '%) — bom condicionamento.')}
                      </div>
                    </div>
                  )}

                  <div className="card">
                    <div className="serif bold fs-13 mb-8">🕐 Tempo Total por Ciclo (min)</div>
                    <div style={{ height: 220 }}>
                      <GraficoCanvas tipo="bar" data={dataTempoTotal} opcoes={optsBase} />
                    </div>
                    {minEconomizado > 0 && (
                      <div className="mono fs-11 txt-green mt-8">Você economizou {minEconomizado} min desde o Ciclo 1</div>
                    )}
                  </div>

                  <HeatmapTemas cs={cs} />
                  <ComparadorCiclos cs={cs} />

                  {teimosos.length > 0 && (
                    <div className="card">
                      <div className="serif bold fs-13 mb-4">🪵 Puzzles Teimosos</div>
                      <div className="mono fs-11 txt-muted mb-12">
                        Errados em ≥2 ciclos — clique pra ver o histórico completo do puzzle ao longo dos ciclos.
                      </div>
                      <div className="vstack gap-8">
                        {teimosos.map(t => (
                          <LinhaTeimoso key={t.id} t={t} />
                        ))}
                      </div>
                    </div>
                  )}

                  {personalWorst.length > 0 && (
                    <div className="card">
                      <div className="serif bold fs-13 mb-4">⏱ Personal Worst</div>
                      <div className="mono fs-11 txt-muted mb-12">
                        Os 10 puzzles em que você gastou mais tempo total. Pode ser ponto cego — ou só puzzle complexo. Você decide.
                      </div>
                      <div className="vstack gap-6">
                        {personalWorst.map((p, i) => (
                          <div key={p.id} className="hstack gap-8 flex-wrap" style={{
                            padding: '6px 10px',
                            background: 'var(--surface)',
                            border: '1px solid var(--border)',
                            borderRadius: 6,
                          }}>
                            <span className="num fs-11 txt-muted" style={{ width: 22 }}>{i + 1}.</span>
                            <span className="num fs-13 bold">{formatarTempoLongo(p.tempoTotal)}</span>
                            <span className="mono fs-10 txt-muted">em {p.n} ciclo{p.n > 1 ? 's' : ''}</span>
                            <span className="mono fs-10 txt-muted">#{p.id}</span>
                            {p.rating && <span className="mono fs-10 txt-muted">{p.rating}</span>}
                            <a href={'https://lichess.org/training/' + p.id} target="_blank" rel="noopener"
                              className="mono fs-10" style={{ color: 'var(--primary)', marginLeft: 'auto' }}>
                              ↗
                            </a>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="card">
                    <div className="metric-grid">
                      <div className="metric-card">
                        <div className="metric-label">CICLOS</div>
                        <div className="metric-value">{cs.length}</div>
                      </div>
                      <div className="metric-card green">
                        <div className="metric-label">MELHOR TAXA</div>
                        <div className="metric-value">{melhorTaxa}%</div>
                      </div>
                      <div className="metric-card slate">
                        <div className="metric-label">REDUÇÃO TEMPO</div>
                        <div className="metric-value" style={{ color: reducaoTempo < 0 ? 'var(--green)' : 'var(--red)' }}>
                          {reducaoTempo > 0 ? '+' : ''}{reducaoTempo}%
                        </div>
                      </div>
                      <div className="metric-card gold">
                        <div className="metric-label">TEMA CRÍTICO</div>
                        <div className="metric-value" style={{ fontSize: 15 }}>{temaCritico}</div>
                      </div>
                    </div>
                    <div className="center mt-16">
                      <span className={status.klass}>{status.label}</span>
                    </div>
                  </div>
                </div>
              )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    /* === CACHE DE PUZZLES POR CONJUNTO ===
       Como localStorage não guarda o conjunto inteiro de objetos puzzle (só os IDs),
       baixamos a faixa novamente quando o conjunto é treinado e filtramos pelos IDs salvos.
       Para tornar isso instantâneo dentro da mesma sessão de browser usamos um cache em memória.
    */
    const memCache = { puzzlesPorConjunto: {} };

    async function carregarPuzzlesDoConjunto(conjunto, onProgress) {
      const cached = memCache.puzzlesPorConjunto[conjunto.id];
      if (cached) return cached;
      onProgress && onProgress("Recuperando puzzles do conjunto...");
      // Usa as faixas reais usadas no momento da montagem (caso tenha havido expansão).
      // Fallback p/ conjuntos antigos sem o campo: deriva do rating ± variacao.
      const chaves = (conjunto.faixas_usadas && conjunto.faixas_usadas.length)
        ? conjunto.faixas_usadas
        : faixasNecessarias(conjunto.rating, conjunto.variacao);
      let todos = [];
      for (const k of chaves) {
        const lista = await buscarFaixa(k, onProgress);
        todos = todos.concat(lista);
      }
      const mapa = new Map(todos.map(p => [p.id || p.puzzleId, p]));
      const ordenados = (conjunto.puzzle_ids || [])
        .map(id => mapa.get(id))
        .filter(Boolean);
      memCache.puzzlesPorConjunto[conjunto.id] = ordenados;
      return ordenados;
    }

    /* === COMPONENTE DE LOADING DE PUZZLES === */
    function LoadingPuzzles({ msg }) {
      return (
        <div className="tela-container narrow card center" style={{ marginTop: 40 }}>
          <div className="serif bold fs-15 mb-12">Carregando puzzles...</div>
          <div className="progress-bar thin mb-12">
            <div className="progress-fill" style={{ width: '70%' }}></div>
          </div>
          <div className="mono fs-12 txt-mid">{msg || 'Carregando...'}</div>
        </div>
      );
    }

    /* === TELA ANALISAR JOGADOR (chess.com username → puzzle_program) === */
    function CoberturaInline({ cobertura }) {
      const c = cobertura.counts || {};
      const nRB = (c.rapid || 0) + (c.blitz || 0);
      const min = window.ChessAnalysis ? window.ChessAnalysis.MIN_RB_OK : 8;
      const ideal = window.ChessAnalysis ? window.ChessAnalysis.MIN_RB_GOOD : 15;
      let nivel, msg, cor;
      if (nRB >= ideal) {
        nivel = 'alta'; cor = 'var(--green)';
        msg = 'Cobertura ideal — análise tática terá confiança alta.';
      } else if (nRB >= min) {
        nivel = 'média'; cor = 'var(--gold)';
        msg = 'Cobertura suficiente — confiança média na detecção de fraquezas.';
      } else if (nRB > 0 || (c.bullet || 0) > 0) {
        nivel = 'baixa'; cor = 'var(--amber)';
        msg = 'Pouca rapid/blitz nos últimos meses — resultado será indicativo.';
      } else {
        nivel = 'insuficiente'; cor = 'var(--red)';
        msg = 'Sem partidas rapid/blitz/bullet nos últimos ' + cobertura.scanned + ' meses.';
      }
      const partes = ['rapid', 'blitz', 'bullet', 'daily']
        .filter(k => (c[k] || 0) > 0)
        .map(k => (c[k] || 0) + ' ' + k);
      return (
        <div className="card-soft" style={{
          padding: '8px 10px', marginBottom: 12,
          borderLeft: '3px solid ' + cor, lineHeight: 1.5
        }}>
          <div className="mono fs-11 txt-mid mb-4">
            Últimos {cobertura.scanned} meses: <span className="bold" style={{ color: cor }}>
              {cobertura.total} partidas elegíveis
            </span>
          </div>
          <div className="mono fs-10 txt-muted mb-4">{partes.join(' · ') || '—'}</div>
          <div className="mono fs-10" style={{ color: cor }}>{msg}</div>
        </div>
      );
    }

    function BadgeConfianca({ level }) {
      const map = {
        alta:         { cor: 'var(--green)',   bg: 'var(--green-bg)',  txt: 'alta' },
        'média':      { cor: 'var(--gold)',    bg: 'var(--gold-bg)',   txt: 'média' },
        baixa:        { cor: 'var(--amber)',   bg: 'var(--gold-bg)',   txt: 'baixa' },
        insuficiente: { cor: 'var(--red)',     bg: 'var(--red-bg)',    txt: 'insuficiente' },
      };
      const s = map[level] || map['média'];
      return (
        <span className="badge" style={{
          background: s.bg, color: s.cor, borderColor: s.cor,
          textTransform: 'uppercase', letterSpacing: 1.5
        }}>{s.txt}</span>
      );
    }

    function TelaAnalisarJogador({ onCriarComTemas, ratingUsuario, tipoInicial }) {
      // tipo='auto' → username do próprio jogador (vem do parâmetro
      // persistente ratingUsuario.chesscom). Mode 3 default + toggle Mode 1.
      // tipo='adversario' → username de um oponente. Sugestões via top
      // enfrentados nos últimos meses do chess.com.
      const meuChesscom = (ratingUsuario && ratingUsuario.chesscom) || '';
      const [tipo, setTipo] = useState(tipoInicial || 'auto');
      const [username, setUsername] = useState(() => {
        const a = Store.get(Chaves.ANALISE_USERNAME, '');
        return a || meuChesscom;
      });
      const [analisando, setAnalisando] = useState(false);
      const [progresso, setProgresso] = useState({ stage: '', message: '', current: 0, total: 0 });
      const [erro, setErro] = useState(null);
      const [programa, setPrograma] = useState(null);
      const [cobertura, setCobertura] = useState(null);
      const [verificandoCob, setVerificandoCob] = useState(false);
      // Sugestões de adversários (top enfrentados, ponderado por modalidade).
      const [sugestoesAdv, setSugestoesAdv] = useState(null);
      const [carregandoSugestoes, setCarregandoSugestoes] = useState(false);
      const [erroSugestoes, setErroSugestoes] = useState(null);
      const wakeLockRef = useRef(null);

      // Carregar último programa do IndexedDB ao abrir (sempre o auto)
      useEffect(() => {
        (async () => {
          const u = (Store.get(Chaves.ANALISE_USERNAME, '') || meuChesscom || '').trim();
          if (!u || !window.ChessAnalysis) return;
          try {
            const p = await window.ChessAnalysis.loadProgram(u);
            if (p) setPrograma(p);
          } catch (e) { /* silencioso */ }
        })();
      }, []);

      // Carrega sugestões de adversário sob demanda. Cache em-memória do
      // componente — fica até trocar de tipo. Requer meuChesscom setado.
      async function carregarSugestoesAdv() {
        if (!meuChesscom || !window.ChessAnalysis) return;
        setCarregandoSugestoes(true);
        setErroSugestoes(null);
        try {
          const lista = await window.ChessAnalysis.topAdversarios(meuChesscom, { maxMonths: 6, top: 5, minGames: 3 });
          setSugestoesAdv(lista);
        } catch (e) {
          setErroSugestoes(e.message || String(e));
          setSugestoesAdv([]);
        } finally {
          setCarregandoSugestoes(false);
        }
      }

      // Trocar entre tipo auto / adversario reseta programa e cobertura.
      // Se voltar pra auto, recarrega username e programa salvos.
      function trocarParaAdversario() {
        setTipo('adversario');
        setUsername('');
        setPrograma(null);
        setCobertura(null);
        setErro(null);
        if (meuChesscom && sugestoesAdv === null && !carregandoSugestoes) {
          carregarSugestoesAdv();
        }
      }

      async function voltarParaAuto() {
        setTipo('auto');
        setCobertura(null);
        setErro(null);
        const u = (Store.get(Chaves.ANALISE_USERNAME, '') || meuChesscom || '').trim();
        setUsername(u);
        if (u && window.ChessAnalysis) {
          try {
            const p = await window.ChessAnalysis.loadProgram(u);
            setPrograma(p || null);
          } catch (_) { setPrograma(null); }
        } else {
          setPrograma(null);
        }
      }

      // Se já entra em modo adversario via prop tipoInicial, dispara o
      // load de sugestões na primeira render (idempotente via state guard).
      useEffect(() => {
        if (tipo === 'adversario' && meuChesscom && sugestoesAdv === null && !carregandoSugestoes) {
          carregarSugestoesAdv();
        }
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [tipo, meuChesscom]);

      // Liberar wake lock ao desmontar
      useEffect(() => {
        return () => {
          if (wakeLockRef.current) {
            try { wakeLockRef.current.release(); } catch (_) {}
            wakeLockRef.current = null;
          }
        };
      }, []);

      async function pedirWakeLock() {
        try {
          if ('wakeLock' in navigator && !wakeLockRef.current) {
            wakeLockRef.current = await navigator.wakeLock.request('screen');
            wakeLockRef.current.addEventListener('release', () => {
              wakeLockRef.current = null;
            });
          }
        } catch (_) { /* sem permissão é ok */ }
      }

      async function liberarWakeLock() {
        if (wakeLockRef.current) {
          try { await wakeLockRef.current.release(); } catch (_) {}
          wakeLockRef.current = null;
        }
      }

      async function verificarCobertura() {
        if (!username.trim()) { setErro('Informe um username'); return; }
        if (!window.ChessAnalysis) return;
        setErro(null);
        setVerificandoCob(true);
        setCobertura(null);
        try {
          const c = await window.ChessAnalysis.peekCoverage(username.trim(), 4);
          setCobertura(c);
        } catch (e) {
          setErro(e.message || String(e));
        } finally {
          setVerificandoCob(false);
        }
      }

      async function iniciarAnalise() {
        if (!username.trim()) { setErro('Informe um username do chess.com'); return; }
        if (!window.ChessAnalysis) { setErro('Módulo de análise não carregou'); return; }
        const u = username.trim();
        // Só persiste username em Chaves.ANALISE_USERNAME quando é o próprio
        // jogador (tipo=auto). Username de adversário fica efêmero.
        if (tipo === 'auto') Store.set(Chaves.ANALISE_USERNAME, u);
        setErro(null);
        setAnalisando(true);
        setProgresso({ stage: 'inicio', message: 'Iniciando...', current: 0, total: 0 });
        await pedirWakeLock();
        // Throttle progress updates a 200ms (item 5: evita re-render storm em
        // partidas de muitos plies — análise pulsa info por lance)
        let lastTick = 0;
        const onProg = (info) => {
          const now = Date.now();
          if (info.stage === 'done' || info.stage === 'aggregate' ||
              info.stage === 'analyze' || (now - lastTick) > 200) {
            lastTick = now;
            setProgresso(info);
          }
        };
        try {
          const p = await window.ChessAnalysis.analyzePlayer(u, onProg);
          setPrograma(p);
          // Não atualizamos mais o rating do usuário a partir da análise
          // — rating é decisão exclusiva da TelaInicio (calibragem ou
          // import lite chess.com). Análise só extrai temas.
        } catch (e) {
          console.error(e);
          setErro(e.message || String(e));
        } finally {
          setAnalisando(false);
          await liberarWakeLock();
        }
      }

      async function reanalisar() {
        if (!programa) return iniciarAnalise();
        if (!confirm('Reanalisar ' + programa.username + '? Leva alguns minutos.')) return;
        try { await window.ChessAnalysis.deleteProgram(programa.username); } catch (_) {}
        setPrograma(null);
        setUsername(programa.username);
        setTimeout(iniciarAnalise, 50);
      }

      // Recebe o programa com os temas do modo ATUAL exibido (programaView).
      // Em modo 'adversario' nomeia como "Vs <username>"; em chances-perdidas
      // como "Foco erros · ..."; em completo, "Análise · ...".
      // Rating do conjunto = sempre o rating do usuário (não o
      // suggested_rating do adversário/análise). Análise só fornece os
      // TEMAS; a faixa de dificuldade é definida pelo usuário na TelaInicio.
      const ratingDoUsuario = (ratingUsuario && ratingUsuario.valor) || 1200;

      function abrirCriarComTemas(programaExibido) {
        const p = programaExibido || programa;
        if (!p) return;
        const temas = (p.themes || []).map(t => t.theme).slice(0, 5);
        if (temas.length === 0) return;
        const ehAdv = p.modo === 'adversario';
        const prefix = ehAdv ? 'Vs ' + p.username + ' · pontos cegos'
                     : p.modo === 'chances-perdidas' ? 'Erros · ' + p.username
                     : 'Análise · ' + p.username;
        onCriarComTemas({
          tipo:     ehAdv ? 'adversario' : 'pessoal',
          username_referencia: p.username,
          rating:   ratingDoUsuario,
          variacao: 200,
          temas:    temas,
          tamanho:  ehAdv ? 200 : 300,
          nome:     prefix,
        });
      }

      function abrirCriarComTema(tema, programaExibido) {
        const p = programaExibido || programa;
        if (!p) return;
        const ehAdv = p.modo === 'adversario';
        const prefix = ehAdv ? 'Vs ' + p.username + ' · ' : 'Foco · ';
        onCriarComTemas({
          tipo:     ehAdv ? 'adversario' : 'pessoal',
          username_referencia: p.username,
          rating:   ratingDoUsuario,
          variacao: 200,
          temas:    [tema],
          tamanho:  ehAdv ? 100 : 200,
          nome:     prefix + (TEMAS[tema] || tema),
        });
      }

      const pct = progresso.total > 0
        ? Math.round((progresso.current / progresso.total) * 100)
        : (progresso.stage === 'init' || progresso.stage === 'fetch_games' ? 5 :
           progresso.stage === 'aggregate' ? 95 :
           progresso.stage === 'done' ? 100 : 0);

      const formatarData = (iso) => {
        if (!iso) return '—';
        try {
          const d = new Date(iso);
          return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        } catch (_) { return iso; }
      };

      const ehAuto = tipo === 'auto';
      const subtitulo = ehAuto
        ? 'Análise das suas últimas ' + (window.ChessAnalysis ? window.ChessAnalysis.GAMES_TARGET : 30) + ' partidas. Plano focado nas suas fraquezas reais.'
        : 'Análise das últimas partidas do oponente. Plano focado nos padrões que ele expõe — incluindo os que ninguém costuma punir.';
      const placeholder = ehAuto ? 'seu username chess.com' : 'username do adversário';
      const labelInput = ehAuto ? 'Seu username chess.com' : 'Username do adversário';
      const labelBotao = ehAuto ? '⚙ Analisar minhas partidas' : '⚙ Analisar partidas do adversário';

      // Trocar tipo via segmented control. Se já tem programa de outro
      // tipo, descartá-lo (visualmente) — programa permanece em
      // IndexedDB e é carregado quando voltamos.
      function aoTrocarTipo(novoTipo) {
        if (novoTipo === tipo) return;
        if (novoTipo === 'adversario') trocarParaAdversario();
        else voltarParaAuto();
      }

      return (
        <div className="tela-container">
          <div className="mb-16">
            <div className="serif bold fs-22 mb-12">🔍 Analisar Jogador</div>
            <div className="mono fs-10 ls-2 txt-muted mb-8">PLANO PARA</div>
            <div className="segmented mb-12">
              <button className={ehAuto ? 'active' : ''}
                onClick={() => aoTrocarTipo('auto')}>
                ♞ MELHORAR MEU JOGO
              </button>
              <button className={!ehAuto ? 'active' : ''}
                onClick={() => aoTrocarTipo('adversario')}>
                ⚔ VENCER UM ADVERSÁRIO
              </button>
            </div>
            <div className="serif fs-13 txt-mid" style={{ lineHeight: 1.6 }}>
              {subtitulo}
            </div>
          </div>

          {!analisando && (
            <div className="card mb-12">
              <div className="input-label">{labelInput}</div>
              <input type="text"
                value={username}
                onChange={e => { setUsername(e.target.value); setCobertura(null); }}
                placeholder={placeholder}
                disabled={analisando}
                style={{
                  width: '100%', padding: '10px 12px', marginBottom: 12,
                  background: 'var(--surface)', color: 'var(--txt)',
                  border: '1px solid var(--border)', borderRadius: 6,
                  fontFamily: 'Courier New, monospace', fontSize: 14, outline: 'none'
                }} />
              {ehAuto && meuChesscom && username !== meuChesscom && (
                <div className="mono fs-10 txt-muted mb-8">
                  Configurado: <span className="bold txt-mid">@{meuChesscom}</span>
                  <button onClick={() => setUsername(meuChesscom)}
                    style={{
                      background: 'none', border: 'none', cursor: 'pointer',
                      color: 'var(--primary)', font: 'inherit', padding: 0, marginLeft: 6,
                    }}>
                    usar
                  </button>
                </div>
              )}
              {!ehAuto && (
                <div className="mb-12">
                  {!meuChesscom ? (
                    <div className="mono fs-10 txt-muted">
                      Configure seu chess.com na home pra ver sugestões de adversários.
                    </div>
                  ) : (
                    <div>
                      <div className="between mb-6">
                        <div className="mono fs-10 ls-2 txt-muted">SUGESTÕES · ONDE MAIS PERDI · 6 MESES</div>
                        <button className="btn btn-small ghost"
                          onClick={carregarSugestoesAdv}
                          disabled={carregandoSugestoes}
                          style={{ padding: '2px 8px' }}>
                          {carregandoSugestoes ? '...' : '↻'}
                        </button>
                      </div>
                      {erroSugestoes && (
                        <div className="mono fs-10 txt-red mb-6">✗ {erroSugestoes}</div>
                      )}
                      {carregandoSugestoes && !sugestoesAdv && (
                        <div className="mono fs-10 txt-muted">Buscando partidas recentes...</div>
                      )}
                      {sugestoesAdv && sugestoesAdv.length === 0 && !carregandoSugestoes && (
                        <div className="mono fs-10 txt-muted">
                          Nenhum adversário com 3+ jogos e ao menos 1 derrota nos últimos 6 meses.
                        </div>
                      )}
                      {sugestoesAdv && sugestoesAdv.length > 0 && (
                        <div className="vstack gap-4">
                          {sugestoesAdv.map(s => {
                            const ativo = username.trim().toLowerCase() === s.username.toLowerCase();
                            return (
                              <button key={s.username}
                                onClick={() => { setUsername(s.username); setCobertura(null); }}
                                style={{
                                  textAlign: 'left', cursor: 'pointer',
                                  background: ativo ? 'var(--primary-bg)' : 'var(--surface)',
                                  border: '1px solid ' + (ativo ? 'var(--primary)' : 'var(--border)'),
                                  borderRadius: 6,
                                  padding: '6px 10px',
                                }}>
                                <div className="hstack gap-8 between flex-wrap">
                                  <span className="serif fs-13 bold">@{s.username}</span>
                                  <span className="mono fs-10 txt-muted">
                                    {s.total}j · {s.W}W/{s.L}L/{s.D}D
                                  </span>
                                </div>
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
              <div className="hstack gap-8 mb-12 flex-wrap">
                <button className="btn btn-primary"
                  onClick={iniciarAnalise}
                  disabled={analisando || !username.trim()}
                  style={{ flex: '1 1 220px' }}>
                  {labelBotao}
                </button>
                <button className="btn btn-ghost btn-small"
                  onClick={verificarCobertura}
                  disabled={analisando || verificandoCob || !username.trim()}>
                  {verificandoCob ? 'Verificando...' : '🔎 Ver cobertura'}
                </button>
              </div>
              {cobertura && <CoberturaInline cobertura={cobertura} />}
              <div className="mono fs-10 txt-muted mt-12" style={{ lineHeight: 1.7 }}>
                Stockfish roda no seu navegador (WASM). Análise leva 3–6 min para 30 partidas.
                Resultado fica salvo localmente.
                {('wakeLock' in (typeof navigator !== 'undefined' ? navigator : {}))
                  ? ' Vamos manter a tela acesa enquanto durar.'
                  : ' No mobile, mantenha a tela acesa.'}
              </div>
            </div>
          )}

          {analisando && (
            <div className="card mb-12">
              <div className="serif bold fs-15 mb-12">Analisando {username}...</div>
              <div className="progress-bar thin mb-12">
                <div className="progress-fill" style={{ width: pct + '%' }}></div>
              </div>
              <div className="mono fs-12 txt-mid mb-8">{progresso.message || '...'}</div>
              <div className="mono fs-10 txt-muted">
                {progresso.stage === 'analyze' && progresso.total
                  ? 'Partida ' + (progresso.current + 1) + '/' + progresso.total + ' — ' + pct + '%'
                  : progresso.stage}
              </div>
            </div>
          )}

          {erro && (
            <div className="feedback-banner red mb-12">
              <div className="feedback-title">⚠ {erro}</div>
              <button className="btn btn-small ghost mt-12" onClick={() => setErro(null)}>Fechar</button>
            </div>
          )}

          {programa && !analisando && (
            <ResultadoAnalise
              programa={programa}
              tipo={tipo}
              onReanalisar={reanalisar}
              onCriarComTemas={abrirCriarComTemas}
              onCriarComTema={abrirCriarComTema}
              onTrocarParaAdversario={trocarParaAdversario}
              formatarData={formatarData} />
          )}
        </div>
      );
    }

    /* === HISTÓRICO DE ANÁLISES (timeline) === */
    /* HistoricoAnalises: src/ui/HistoricoAnalises.jsx */

    function ResultadoAnalise({ programa, tipo, onReanalisar, onCriarComTemas, onCriarComTema, onTrocarParaAdversario, formatarData }) {
      // tipo: 'auto' (default) ou 'adversario'.
      // modoView: para tipo=auto, alterna entre 'completo' (Mode 3 default —
      // o programa salvo) e 'chances-perdidas' (re-derivado via Modo 1).
      // Para tipo=adversario, sempre Mode 2 (modoView ignorado).
      const ehAuto = tipo !== 'adversario';
      const [modoView, setModoView] = useState('completo');

      // Re-deriva o programa visível a partir de programa.profile quando
      // muda modoView ou tipo. Programas legados (sem profile) caem no
      // próprio programa.themes (Mode 3) sem possibilidade de Mode 1.
      const programaView = useMemo(() => {
        const Agg = window.TacticalAggregator;
        const profile = programa && programa.profile;
        const avg = (programa && programa.avg_rating) || programa.suggested_rating;
        if (!ehAuto && profile && Agg && Agg.derivePuzzleProgramModo2) {
          const p2 = Agg.derivePuzzleProgramModo2(profile, avg);
          return Object.assign({}, programa, p2);
        }
        if (ehAuto && modoView === 'chances-perdidas' && profile && Agg && Agg.derivePuzzleProgramModo1) {
          const p1 = Agg.derivePuzzleProgramModo1(profile, avg);
          return Object.assign({}, programa, p1);
        }
        return programa;
      }, [programa, tipo, modoView, ehAuto]);

      const conf = programaView.tactical_confidence || {};
      const rng  = programaView.rating_range || [programaView.suggested_rating - 100, programaView.suggested_rating + 100];

      // Ordenar: detected → heuristic → rating; em adversário todas as fontes
      // são "detected-adversario" então a ordem fica por priority/score.
      const ordemFonte = { detected: 0, 'detected-adversario': 0, heuristic: 1, rating: 2 };
      const temasOrdenados = (programaView.themes || []).slice().sort((a, b) => {
        const fa = ordemFonte[a.source] != null ? ordemFonte[a.source] : 9;
        const fb = ordemFonte[b.source] != null ? ordemFonte[b.source] : 9;
        if (fa !== fb) return fa - fb;
        const pa = a.priority === 'alta' ? 0 : 1;
        const pb = b.priority === 'alta' ? 0 : 1;
        return pa - pb;
      });

      const fonteLabel = (s) => s === 'detected' ? '🎯 detectado nas suas partidas'
                              : s === 'detected-adversario' ? '⚔ ponto cego do adversário'
                              : s === 'heuristic' ? '🧠 sugerido pela fase de erros'
                              : s === 'rating'    ? '📚 fundamento da faixa'
                              : s;
      const profileAusente = !programa || !programa.profile;

      // Contar puzzles disponíveis por tema dentro do range sugerido
      // (rating ± 200). Ajuda a validar se a recomendação tem material no
      // banco; também avisa quando um tema vai vir com conjunto vazio.
      // Re-roda quando programaView muda de modo (temas podem ser diferentes).
      const [contagens, setContagens] = useState({});
      const [contando, setContando] = useState(false);
      useEffect(() => {
        let cancelado = false;
        (async () => {
          if (!programaView || !programaView.themes) return;
          setContando(true);
          try {
            const r = programaView.suggested_rating;
            const variacao = 200;
            const min = r - variacao, max = r + variacao;
            const faixas = faixasNoIntervalo(min, max);
            const todos = [];
            for (const k of faixas) {
              let lista = cacheFaixas[k];
              if (!lista) {
                lista = await buscarFaixa(k);
              }
              todos.push(...lista);
              if (cancelado) return;
            }
            const out = {};
            for (const t of programaView.themes) {
              if (out[t.theme] != null) continue;
              const n = todos.reduce((acc, p) => {
                if ((p.rating || 0) < min || (p.rating || 0) > max) return acc;
                const ts = p.themes || p.temas || [];
                return ts.includes(t.theme) ? acc + 1 : acc;
              }, 0);
              out[t.theme] = n;
            }
            if (!cancelado) setContagens(out);
          } catch (_) { /* silencioso */ }
          finally { if (!cancelado) setContando(false); }
        })();
        return () => { cancelado = true; };
      }, [programaView && programaView.username, programaView && programaView.analyzed_at, programaView && programaView.modo]);

      const modoLabel = !ehAuto ? 'Modo: análise de adversário'
                      : modoView === 'chances-perdidas' ? 'Modo: chances perdidas'
                      : 'Modo: plano completo';
      const modoDescricao = !ehAuto
        ? 'Padrões que ' + programa.username + ' expõe quando erra. C-dominantes (não-punidos) ranqueados primeiro — pontos cegos que ninguém costuma explorar.'
        : modoView === 'chances-perdidas'
          ? 'Apenas temas onde você teve a tática na frente e não viu (Role A dominante). Sem heurísticas nem fundamentos por rating.'
          : 'Suas fraquezas detectadas + heurísticas por fase de erro + fundamentos da faixa de rating.';

      return (
        <div>
          <div className="card mb-12">
            <div className="between mb-8" style={{ flexWrap: 'wrap', gap: 8 }}>
              <div>
                <div className="mono fs-10 ls-2 txt-muted">{ehAuto ? 'JOGADOR' : 'ADVERSÁRIO'}</div>
                <div className="serif bold fs-17">{programa.username}</div>
              </div>
              <div className="vstack gap-4" style={{ alignItems: 'flex-end' }}>
                <BadgeConfianca level={conf.level} />
                <div className="mono fs-10 txt-muted">{formatarData(programa.analyzed_at)}</div>
              </div>
            </div>
            <div className="hstack gap-12 flex-wrap mb-8">
              <div>
                <div className="mono fs-10 ls-2 txt-muted">RATING SUGERIDO</div>
                <div className="num-display num-lg">{programaView.suggested_rating}</div>
                {programaView.original_rating && (
                  <div className="mono fs-10 txt-muted mt-4">
                    rating real {programaView.original_rating} ·{' '}
                    {programaView.original_rating > programaView.suggested_rating ? 'topo' : 'piso'} do banco
                  </div>
                )}
              </div>
              <div>
                <div className="mono fs-10 ls-2 txt-muted">FAIXA</div>
                <div className="num fs-13">{rng[0]} – {rng[1]}</div>
              </div>
              {programa.games_analyzed && (
                <div>
                  <div className="mono fs-10 ls-2 txt-muted">PARTIDAS</div>
                  <div className="serif fs-13">
                    {programa.games_analyzed}
                    {programa.games_breakdown && (
                      <span className="mono fs-11 txt-muted">
                        {' '}({Object.entries(programa.games_breakdown).map(([k,v]) => v + k[0]).join(' · ')})
                      </span>
                    )}
                  </div>
                </div>
              )}
            </div>
            {conf.note && (
              <div className="mono fs-11 txt-mid" style={{
                padding: '8px 10px', background: 'var(--surface)',
                borderLeft: '3px solid var(--gold)', borderRadius: 4, lineHeight: 1.5
              }}>
                {conf.note}
              </div>
            )}
          </div>

          {/* Toggle de modo (só faz sentido em tipo=auto e quando profile salvo) */}
          {ehAuto && !profileAusente && (
            <div className="card-soft mb-12" style={{ padding: '8px 12px' }}>
              <div className="hstack gap-8 flex-wrap" style={{ alignItems: 'baseline' }}>
                <div className="mono fs-10 ls-2 txt-muted" style={{ flex: '1 1 auto' }}>
                  {modoLabel.toUpperCase()}
                </div>
                <button className="btn btn-small ghost"
                  onClick={() => setModoView(modoView === 'completo' ? 'chances-perdidas' : 'completo')}>
                  {modoView === 'completo' ? '🎯 Ver só chances perdidas' : '📚 Ver plano completo'}
                </button>
              </div>
              <div className="mono fs-10 txt-muted mt-4" style={{ lineHeight: 1.5 }}>
                {modoDescricao}
              </div>
            </div>
          )}
          {!ehAuto && (
            <div className="card-soft mb-12" style={{ padding: '8px 12px', borderLeft: '3px solid var(--red)' }}>
              <div className="mono fs-10 ls-2 txt-muted mb-4">{modoLabel.toUpperCase()}</div>
              <div className="mono fs-10 txt-muted" style={{ lineHeight: 1.5 }}>
                {modoDescricao}
              </div>
            </div>
          )}
          {profileAusente && ehAuto && (
            <div className="card-soft mb-12" style={{ padding: '8px 12px' }}>
              <div className="mono fs-10 txt-muted" style={{ lineHeight: 1.5 }}>
                Análise antiga (sem profile salvo). Reanalise pra desbloquear o modo "chances perdidas".
              </div>
            </div>
          )}

          <HistoricoAnalises
            username={programa.username}
            currentAnalyzedAt={programa.analyzed_at}
            formatarData={formatarData} />

          {conf.level === 'insuficiente' ? (
            <div className="feedback-banner red mb-12">
              <div className="feedback-title">⚠ Amostra insuficiente</div>
              <div className="serif fs-13 mt-8">
                Jogue partidas rapid ou blitz no chess.com para uma análise tática confiável.
              </div>
            </div>
          ) : temasOrdenados.length === 0 ? (
            <div className="feedback-banner mb-12" style={{
              background: 'var(--surface)', borderColor: 'var(--border)',
              borderLeft: '3px solid var(--gold)'
            }}>
              <div className="feedback-title">
                {!ehAuto ? '✅ Sem pontos cegos detectados'
                 : modoView === 'chances-perdidas' ? '✅ Nenhuma chance perdida nesse padrão'
                 : 'Sem temas recomendados'}
              </div>
              <div className="serif fs-13 mt-8">
                {!ehAuto
                  ? 'O adversário não expôs padrões táticos exploráveis na amostra analisada — ou expôs muito pouco. Pode ser jogador sólido ou amostra pequena.'
                  : modoView === 'chances-perdidas'
                    ? 'Você não deixou táticas óbvias passarem. Volte para "Plano completo" pra ver fundamentos por rating + heurísticas.'
                    : 'Reanalise ou troque de modo.'}
              </div>
            </div>
          ) : (
            <div className="card mb-12">
              <div className="between mb-12">
                <div className="serif bold fs-15">
                  {!ehAuto ? 'Pontos cegos para explorar' : 'Temas recomendados'}
                </div>
                {contando && <div className="mono fs-10 txt-muted">contando puzzles...</div>}
              </div>
              <div className="vstack gap-10">
                {temasOrdenados.map((t, i) => {
                  const n = contagens[t.theme];
                  const semPuzzles = n != null && n === 0;
                  return (
                  <div key={t.theme + '-' + i} className="card-soft" style={{
                    padding: '10px 12px',
                    opacity: semPuzzles ? 0.55 : 1,
                  }}>
                    <div className="between mb-4" style={{ flexWrap: 'wrap', gap: 8 }}>
                      <div>
                        <span className="serif bold fs-13">{TEMAS[t.theme] || t.label || t.theme}</span>
                        {' '}
                        <span className="badge" style={{
                          background: t.priority === 'alta' ? 'var(--red-bg)' : 'var(--gold-bg)',
                          color:      t.priority === 'alta' ? 'var(--red)'    : 'var(--gold)',
                          borderColor: t.priority === 'alta' ? 'var(--red)'    : 'var(--gold)',
                          marginLeft: 6, textTransform: 'uppercase', letterSpacing: 1
                        }}>{t.priority}</span>
                        {n != null && (
                          <span className="badge" style={{
                            marginLeft: 6,
                            background: semPuzzles ? 'var(--red-bg)' : 'var(--surface)',
                            color:      semPuzzles ? 'var(--red)'    : 'var(--txt-mid)',
                            borderColor: semPuzzles ? 'var(--red)'   : 'var(--border)',
                          }}>
                            {semPuzzles ? '⚠ 0 puzzles' : (n + ' puzzles')}
                          </span>
                        )}
                      </div>
                      <button className="btn btn-small"
                        onClick={() => onCriarComTema(t.theme, programaView)}
                        disabled={semPuzzles}
                        title={semPuzzles ? 'Sem puzzles disponíveis na faixa' : ''}>
                        ▶ Treinar
                      </button>
                    </div>
                    <div className="mono fs-10 txt-muted">{fonteLabel(t.source)}</div>
                  </div>
                  );
                })}
              </div>
            </div>
          )}

          {conf.level !== 'insuficiente' && temasOrdenados.length > 0 && (
            <div className="vstack gap-8">
              <button className="btn btn-primary btn-block" onClick={() => onCriarComTemas(programaView)}>
                ＋ Criar conjunto com top temas
              </button>
              <button className="btn btn-ghost btn-block" onClick={onReanalisar}>
                ↻ Reanalisar
              </button>
            </div>
          )}

          {conf.level === 'insuficiente' && (
            <button className="btn btn-ghost btn-block" onClick={onReanalisar}>
              ↻ Reanalisar
            </button>
          )}
        </div>
      );
    }


    /* === APP ROOT === */
    function App() {
      const [tela, setTela] = useState('inicio');
      const [conjuntos, setConjuntos] = useState(() => Store.get(Chaves.CONJUNTOS, []));
      const [ciclos, setCiclos] = useState(() => Store.get(Chaves.CICLOS, []));

      // Rating do usuário como entidade. Definido via calibragem ou
      // import chess.com (não há entrada manual). Usado por TelaCriar
      // (faixa de puzzles) e por toda inferência de rating-related.
      const [ratingUsuario, setRatingUsuarioState] = useState(() => ({
        valor:    Store.get(Chaves.RATING_USUARIO, null),
        fonte:    Store.get(Chaves.RATING_FONTE, null),
        data:     Store.get(Chaves.RATING_DATA, null),
        chesscom: Store.get(Chaves.RATING_CHESSCOM_USERNAME, null),
      }));
      function setRatingUsuario(valor, fonte, chesscomUser) {
        const v = parseInt(valor, 10);
        if (!v || isNaN(v)) return;
        const novo = {
          valor:    v,
          fonte:    fonte || 'manual',
          data:     Date.now(),
          chesscom: chesscomUser || ratingUsuario.chesscom,
        };
        setRatingUsuarioState(novo);
        Store.set(Chaves.RATING_USUARIO, novo.valor);
        Store.set(Chaves.RATING_FONTE, novo.fonte);
        // Definir rating também encerra onboarding (pra modal não voltar)
        Store.set(Chaves.ONBOARDING_VISTO, true);
        Store.set(Chaves.RATING_DATA, novo.data);
        if (novo.chesscom) Store.set(Chaves.RATING_CHESSCOM_USERNAME, novo.chesscom);
      }
      // Editar/setar só o username chess.com (parâmetro independente de
      // rating). Usado pra trocar de conta sem reimportar rating.
      function setChesscomUsername(u) {
        const limpo = (u || '').trim();
        setRatingUsuarioState(prev => ({ ...prev, chesscom: limpo || null }));
        if (limpo) Store.set(Chaves.RATING_CHESSCOM_USERNAME, limpo);
        else Store.remove(Chaves.RATING_CHESSCOM_USERNAME);
      }

      const [conjuntoAtivo, setConjuntoAtivo] = useState(null);
      const [cicloAtual, setCicloAtual] = useState(null);
      const [puzzlesAtivos, setPuzzlesAtivos] = useState(null);
      const [carregando, setCarregando] = useState(false);
      const [carregandoMsg, setCarregandoMsg] = useState('');
      const [erroCarregar, setErroCarregar] = useState(null);
      const [sessaoSalva, setSessaoSalva] = useState(() => Store.get(Chaves.SESSAO, null));
      const [showModalRetomar, setShowModalRetomar] = useState(() => !!Store.get(Chaves.SESSAO, null));
      const [evolucaoConjunto, setEvolucaoConjunto] = useState(null);
      const [presetCriar, setPresetCriar] = useState(null);
      // Estado de qual tipo abrir TelaAnalisarJogador. Definido pelos
      // CTAs da TelaInicio (Pessoal → 'auto', Adversário → 'adversario').
      const [tipoAnalise, setTipoAnalise] = useState('auto');

      useEffect(() => { Store.set(Chaves.CONJUNTOS, conjuntos); }, [conjuntos]);
      useEffect(() => { Store.set(Chaves.CICLOS, ciclos); }, [ciclos]);

      function navegar(t) {
        if (tela === 'treinar') {
          if (!confirm('Sair do treino? Sua sessão será salva para retomada.')) return;
        }
        setTela(t);
      }

      // Atalhos rápidos de navegação (1-5 → telas, ? → help, Esc fecha).
      // Vim-style minimalista: app não tem listas profundas o suficiente
      // pra justificar h/j/k/l puro.
      const [mostraHelp, setMostraHelp] = useState(false);
      useKeyboardShortcuts((e) => {
        // Não captura quando usuário está em input/textarea (já protegido
        // pelo useKeyboardShortcuts) nem quando está treinando (TelaTreinar
        // tem seus próprios atalhos que precisam preferência).
        if (tela === 'treinar') return;
        if (e.key === '?') { e.preventDefault(); setMostraHelp(h => !h); return; }
        if (e.key === 'Escape' && mostraHelp) { e.preventDefault(); setMostraHelp(false); return; }
        if (e.key === '1') { e.preventDefault(); setTela('inicio'); }
        else if (e.key === '2') { e.preventDefault(); setTela('evolucao'); }
      }, [tela, mostraHelp]);

      // Companion áudio: opt-in. Persistido em Chaves.AUDIO_ON.
      const [audioOn, setAudioOn] = useState(() => Store.get(Chaves.AUDIO_ON, false));
      useEffect(() => { Store.set(Chaves.AUDIO_ON, audioOn); }, [audioOn]);
      function toggleAudio() {
        setAudioOn(a => {
          const novo = !a;
          // tom de confirmação ao ligar (feedback imediato + desbloqueia
          // AudioContext que precisa de user gesture na primeira vez)
          if (novo && window.WP && window.WP.Audio) {
            try { window.WP.Audio.tom(660, 80, { vol: 0.05 }); } catch (_) {}
          }
          return novo;
        });
      }

      function persistirSessao(s) {
        setSessaoSalva(s);
        Store.set(Chaves.SESSAO, s);
      }
      function limparSessao() {
        setSessaoSalva(null);
        Store.remove(Chaves.SESSAO);
      }

      // Salvar conjunto novo
      function aoSalvarConjunto(novo, puzzles, treinar) {
        setConjuntos(cs => cs.concat([novo]));
        memCache.puzzlesPorConjunto[novo.id] = puzzles;
        if (treinar) {
          iniciarCiclo(novo, puzzles, 1, false);
        } else {
          setTela('conjuntos');
        }
      }

      // Excluir conjunto
      // Marca conjunto como concluído. Sai dos ativos, fica em histórico
      // (visível em TelaEvolucao). Pode ser chamado manualmente pelo
      // usuário OU automaticamente quando libera vaga pra criar novo.
      function concluirConjunto(id) {
        setConjuntos(cs => cs.map(c =>
          c.id === id ? window.WP.Conjunto.concluir(c) : c
        ));
      }

      function excluirConjunto(id) {
        setConjuntos(cs => cs.filter(c => c.id !== id));
        setCiclos(cs => cs.filter(c => c.conjunto_id !== id));
        delete memCache.puzzlesPorConjunto[id];
      }

      // Atualizar conjunto (notas e outros campos editáveis)
      function atualizarConjunto(novo) {
        setConjuntos(cs => cs.map(c => c.id === novo.id ? { ...c, ...novo } : c));
      }

      // Calibração: cria conjunto efêmero com rating amplo (1400 ± 800), 30 puzzles,
      // sem temas, e inicia treino. Após o ciclo, TelaConclusao mostra rating sugerido.
      async function iniciarCalibracao() {
        setCarregando(true);
        setErroCarregar(null);
        setCarregandoMsg('Montando puzzles de calibração...');
        try {
          const r = await montarConjunto(1400, 800, [], 30, setCarregandoMsg);
          if (r.puzzles.length === 0) {
            setErroCarregar('Não foi possível montar a calibração — sem puzzles disponíveis.');
            setCarregando(false);
            return;
          }
          const novo = {
            id: gerarId(),
            nome: '🎯 Calibração',
            criado_em: Date.now(),
            rating: 1400,
            variacao: 800,
            temas: [],
            tamanho: r.puzzles.length,
            puzzle_ids: r.puzzles.map(p => p.id || p.puzzleId),
            faixas_usadas: r.stats.faixas_usadas,
            range_efetivo: r.stats.range_efetivo,
            calibracao: true
          };
          setConjuntos(cs => cs.concat([novo]));
          memCache.puzzlesPorConjunto[novo.id] = r.puzzles;
          iniciarCiclo(novo, r.puzzles, 1, false);
        } catch (e) {
          setErroCarregar('Falha ao iniciar calibração: ' + (e.message || e));
        } finally {
          setCarregando(false);
        }
      }

      // Fluxo de onboarding: import chess.com → conjunto inicial de 5
      // puzzles na faixa do rating + inicia ciclo direto. Marca o conjunto
      // com eh_onboarding=true pra TelaConclusao detectar fim em 3 ciclos.
      async function aoConcluirOnboarding(rating, username) {
        setRatingUsuario(rating, 'chesscom', username);
        setCarregando(true);
        setErroCarregar(null);
        setCarregandoMsg('Montando seus 5 puzzles iniciais...');
        try {
          const r = await montarConjunto(rating, 200, [], 5, setCarregandoMsg);
          if (r.puzzles.length === 0) {
            setErroCarregar('Não foi possível montar o conjunto inicial — tente calibrar manualmente.');
            setCarregando(false);
            return;
          }
          const novo = {
            id: gerarId(),
            nome: 'Primeiros 5',
            criado_em: Date.now(),
            rating: rating,
            variacao: 200,
            temas: [],
            tamanho: r.puzzles.length,
            tipo: 'padrao',
            puzzle_ids: r.puzzles.map(p => p.id || p.puzzleId),
            faixas_usadas: r.stats.faixas_usadas,
            range_efetivo: r.stats.range_efetivo,
            eh_onboarding: true,
          };
          setConjuntos(cs => cs.concat([novo]));
          memCache.puzzlesPorConjunto[novo.id] = r.puzzles;
          iniciarCiclo(novo, r.puzzles, 1, false);
        } catch (e) {
          setErroCarregar('Falha no conjunto inicial: ' + (e.message || e));
        } finally {
          setCarregando(false);
        }
      }

      // Iniciar treino
      async function iniciarTreino(conjunto) {
        const cs = ciclosDoConjunto(ciclos, conjunto.id);
        setConjuntoAtivo(conjunto);
        if (cs.length === 0) {
          await carregarEIniciar(conjunto, 1, false);
        } else {
          setTela('selecao');
        }
      }

      async function carregarEIniciar(conjunto, numero, apenasErros) {
        setCarregando(true);
        setErroCarregar(null);
        setCarregandoMsg('Recuperando puzzles do conjunto...');
        try {
          const todos = await carregarPuzzlesDoConjunto(conjunto, setCarregandoMsg);
          let puzzles = todos;
          if (apenasErros) {
            const ult = ultimoCiclo(ciclos, conjunto.id);
            if (ult) {
              const idsErr = new Set(ult.resultados.filter(r => !r.correto).map(r => r.puzzle_id));
              puzzles = todos.filter(p => idsErr.has(p.id || p.puzzleId));
            }
          }
          if (puzzles.length === 0) {
            setErroCarregar('Nenhum puzzle disponível para esse modo.');
            setCarregando(false);
            return;
          }
          iniciarCiclo(conjunto, puzzles, numero, apenasErros);
        } catch (e) {
          console.error(e);
          setErroCarregar('Falha ao baixar puzzles: ' + (e.message || e));
        } finally {
          setCarregando(false);
        }
      }

      function iniciarCiclo(conjunto, puzzles, numero, apenasErros) {
        const ciclo = {
          id: gerarId(),
          conjunto_id: conjunto.id,
          numero,
          data_inicio: Date.now(),
          apenas_erros: apenasErros,
          iniciado_em: Date.now()
        };
        setConjuntoAtivo(conjunto);
        setCicloAtual(ciclo);
        // Embaralha a ordem a cada ciclo (mantém o conjunto fixo, varia a sequência).
        // Combate viés de associação posicional — sem isso, o usuário começa a
        // memorizar "esse puzzle vem depois daquele", em vez do padrão tático em si.
        setPuzzlesAtivos(embaralhar(puzzles));
        setTela('treinar');
      }

      function aoConcluirCiclo(resultados, opts) {
        opts = opts || {};
        const total = resultados.length;
        const acertos = resultados.filter(r => r.correto).length;
        const erros = total - acertos;
        const tempoTotal = resultados.reduce((a, r) => a + (r.tempo_s || 0), 0);
        const tempoMedio = total ? Math.round(tempoTotal / total) : 0;
        const cicloFinal = {
          ...cicloAtual,
          data_fim: Date.now(),
          total, acertos, erros,
          tempo_medio_s: tempoMedio,
          tempo_total_s: tempoTotal,
          resultados,
          reflexoes: opts.reflexoes || [],
        };
        setCiclos(cs => cs.concat([cicloFinal]));
        setCicloAtual(cicloFinal);
        limparSessao();
        setTela('conclusao');

        // Conjunto de calibragem: ao concluir, gravar rating do usuário
        // automaticamente — fonte 'calibragem'. Substitui valores
        // anteriores (assume calibragem mais recente é a verdade).
        if (cicloAtual && cicloAtual.calibracao) {
          const r = calcularRatingSugerido(cicloFinal);
          if (r != null) setRatingUsuario(r, 'calibragem', null);
        }

        // Auto-backup opcional: dispara download do JSON após o ciclo ser persistido.
        // Aguarda o useEffect de setCiclos gravar no localStorage antes de gerar o blob.
        if (Store.get(Chaves.AUTO_BACKUP, false)) {
          setTimeout(() => {
            try { exportarBackup(); } catch (e) { console.warn("auto-backup falhou:", e); }
          }, 200);
        }
      }

      // Continuar treino (botão da tela inicial)
      async function continuarTreino() {
        if (sessaoSalva) {
          retomarSessao();
          return;
        }
        if (conjuntos.length === 0) { setTela('criar'); return; }
        // Pega o último conjunto com ciclos, ou o primeiro
        const comCiclos = conjuntos.filter(c => ciclosDoConjunto(ciclos, c.id).length > 0);
        const alvo = comCiclos.length ? comCiclos[comCiclos.length - 1] : conjuntos[0];
        await iniciarTreino(alvo);
      }

      // Retomar sessão
      async function retomarSessao() {
        if (!sessaoSalva) return;
        const conjunto = conjuntos.find(c => c.id === sessaoSalva.conjunto_id);
        if (!conjunto) {
          alert('Conjunto da sessão não foi encontrado. Sessão descartada.');
          limparSessao();
          setShowModalRetomar(false);
          return;
        }
        setShowModalRetomar(false);
        setCarregando(true);
        setCarregandoMsg('Restaurando sessão...');
        try {
          const todos = await carregarPuzzlesDoConjunto(conjunto, setCarregandoMsg);
          const mapa = new Map(todos.map(p => [p.id || p.puzzleId, p]));
          const puzzles = sessaoSalva.puzzle_ids_ciclo.map(id => mapa.get(id)).filter(Boolean);
          const ciclo = {
            id: gerarId(),
            conjunto_id: conjunto.id,
            numero: sessaoSalva.ciclo_numero,
            data_inicio: sessaoSalva.iniciado_em || Date.now(),
            apenas_erros: !!sessaoSalva.apenas_erros,
            iniciado_em: sessaoSalva.iniciado_em || Date.now()
          };
          setConjuntoAtivo(conjunto);
          setCicloAtual(ciclo);
          setPuzzlesAtivos(puzzles);
          setTela('treinar');
        } catch (e) {
          alert('Falha ao restaurar sessão: ' + (e.message || e));
          limparSessao();
        } finally {
          setCarregando(false);
        }
      }

      function descartarSessao() {
        limparSessao();
        setShowModalRetomar(false);
      }

      function sairDoTreino() {
        if (confirm('Sair do treino? Sua sessão fica salva para retomada.')) {
          setTela('conjuntos');
        }
      }

      // Próximo ciclo a partir da conclusão
      async function aoProximoCiclo() {
        if (!conjuntoAtivo || !cicloAtual) return;
        await carregarEIniciar(conjuntoAtivo, cicloAtual.numero + 1, false);
      }
      async function aoApenasErros() {
        if (!conjuntoAtivo || !cicloAtual) return;
        await carregarEIniciar(conjuntoAtivo, cicloAtual.numero + 1, true);
      }

      const ocultarSidebar = tela === 'treinar';
      const [mostraConfig, setMostraConfig] = useState(false);

      return (
        <div className="app-shell">
          <Header onAbrirConfig={() => setMostraConfig(true)} />
          {mostraConfig && (
            <SettingsModal
              audioOn={audioOn}
              onToggleAudio={toggleAudio}
              onAposImport={() => {
                setConjuntos(Store.get(Chaves.CONJUNTOS, []));
                setCiclos(Store.get(Chaves.CICLOS, []));
                setSessaoSalva(Store.get(Chaves.SESSAO, null));
                setMostraConfig(false);
              }}
              onFechar={() => setMostraConfig(false)} />
          )}

          {showModalRetomar && sessaoSalva && (
            <ModalRetomada
              sessao={sessaoSalva}
              conjunto={conjuntos.find(c => c.id === sessaoSalva.conjunto_id)}
              onRetomar={retomarSessao}
              onDescartar={descartarSessao}
            />
          )}

          {!ocultarSidebar && (
            <Sidebar mobile tela={tela} onNav={navegar} />
          )}

          <div className="main-row">
            {!ocultarSidebar && <Sidebar tela={tela} onNav={navegar} />}

            <div className={'content-area' + (ocultarSidebar ? ' fullbleed' : '')}>
              {carregando && <LoadingPuzzles msg={carregandoMsg} />}
              {erroCarregar && (
                <div className="feedback-banner red tela-container narrow" style={{ marginTop: 20, marginBottom: 20 }}>
                  <div className="feedback-title">⚠ {erroCarregar}</div>
                  <button className="btn btn-small ghost mt-12" onClick={() => setErroCarregar(null)}>Fechar</button>
                </div>
              )}

              {!carregando && tela === 'inicio' && (
                <TelaInicio
                  conjuntos={conjuntos}
                  ciclos={ciclos}
                  ratingUsuario={ratingUsuario}
                  onContinuar={continuarTreino}
                  onTreinar={iniciarTreino}
                  onEvolucao={(c) => { setEvolucaoConjunto(c); setTela('evolucao'); }}
                  onTreinarApenasErros={(conjunto) => {
                    const cs = ciclosDoConjunto(ciclos, conjunto.id);
                    setConjuntoAtivo(conjunto);
                    carregarEIniciar(conjunto, cs.length + 1, true);
                  }}
                  onConcluirConjunto={concluirConjunto}
                  onIrParaConjuntos={() => setTela('conjuntos')}
                  onCalibrar={iniciarCalibracao}
                  onSetRatingChesscom={(rating, username) => {
                    if (rating && rating >= 600 && rating <= 2800) setRatingUsuario(rating, 'chesscom', username);
                  }}
                  onSetChesscomUsername={setChesscomUsername}
                  onOnboardingConcluir={aoConcluirOnboarding}
                  onCriarPadrao={() => {
                    setPresetCriar({ tipo: 'padrao', rating: ratingUsuario.valor });
                    setTela('criar');
                  }}
                  onCriarPessoal={() => {
                    // Pessoal usa o pipeline de análise — abre TelaAnalisar
                    // em modo auto. O conjunto é gerado lá via 'Criar
                    // conjunto com top temas' e marcado tipo='pessoal'.
                    setTipoAnalise('auto');
                    setTela('analisar');
                  }}
                  onCriarAdversario={() => {
                    setTipoAnalise('adversario');
                    setTela('analisar');
                  }}
                />
              )}
              {!carregando && tela === 'conjuntos' && (
                <TelaConjuntos
                  conjuntos={conjuntos}
                  ciclos={ciclos}
                  onTreinar={iniciarTreino}
                  onEvolucao={(c) => { setEvolucaoConjunto(c); setTela('evolucao'); }}
                  onExcluir={excluirConjunto}
                  onAtualizar={atualizarConjunto}
                  onCriar={() => setTela('criar')}
                />
              )}
              {!carregando && tela === 'criar' && (
                <TelaCriar
                  preset={presetCriar}
                  ratingUsuario={ratingUsuario}
                  onSalvarTreinar={(novo, puzzles) => { setPresetCriar(null); aoSalvarConjunto(novo, puzzles, true); }}
                  onSalvar={(novo, puzzles) => { setPresetCriar(null); aoSalvarConjunto(novo, puzzles, false); }}
                  onCancelar={() => { setPresetCriar(null); setTela('inicio'); }}
                />
              )}
              {!carregando && tela === 'selecao' && conjuntoAtivo && (
                <TelaSelecao
                  conjunto={conjuntoAtivo}
                  ciclos={ciclos}
                  onIniciar={(apenasErros) => {
                    const cs = ciclosDoConjunto(ciclos, conjuntoAtivo.id);
                    carregarEIniciar(conjuntoAtivo, cs.length + 1, apenasErros);
                  }}
                  onVoltar={() => setTela('conjuntos')}
                />
              )}
              {!carregando && tela === 'treinar' && conjuntoAtivo && cicloAtual && puzzlesAtivos && (
                <TelaTreinar
                  conjunto={conjuntoAtivo}
                  ciclo={cicloAtual}
                  puzzles={puzzlesAtivos}
                  ciclosAnteriores={ciclosDoConjunto(ciclos, conjuntoAtivo.id)}
                  sessao={sessaoSalva && sessaoSalva.conjunto_id === conjuntoAtivo.id ? sessaoSalva : null}
                  onConcluir={aoConcluirCiclo}
                  onSalvarSessao={persistirSessao}
                  onSair={sairDoTreino}
                  onAtualizarConjunto={(novo) => {
                    atualizarConjunto(novo);
                    setConjuntoAtivo(c => c && c.id === novo.id ? { ...c, ...novo } : c);
                  }}
                />
              )}
              {!carregando && tela === 'conclusao' && conjuntoAtivo && cicloAtual && (
                <TelaConclusao
                  conjunto={conjuntoAtivo}
                  ciclo={cicloAtual}
                  ciclosAnteriores={ciclosDoConjunto(ciclos, conjuntoAtivo.id)}
                  onProximoCiclo={aoProximoCiclo}
                  onApenasErros={aoApenasErros}
                  onEvolucao={() => { setEvolucaoConjunto(conjuntoAtivo); setTela('evolucao'); }}
                  onCriarComRating={(rating) => {
                    setPresetCriar({ rating, variacao: 200, temas: [], tamanho: 1000, nome: '' });
                    setTela('criar');
                  }}
                  onConcluirConjunto={(id) => {
                    concluirConjunto(id);
                    setTela('conjuntos');
                  }}
                  onCalibrar={iniciarCalibracao}
                  onExcluirConjunto={(id) => {
                    excluirConjunto(id);
                    setTela('inicio');
                  }}
                />
              )}
              {!carregando && tela === 'evolucao' && (
                <TelaEvolucao
                  conjuntos={conjuntos}
                  ciclos={ciclos}
                  conjuntoInicial={evolucaoConjunto}
                  onVoltar={() => setTela('conjuntos')}
                  onCriarFocado={(tema, conjuntoBase) => {
                    setPresetCriar({
                      rating: conjuntoBase ? conjuntoBase.rating : 1200,
                      variacao: conjuntoBase ? conjuntoBase.variacao : 200,
                      temas: [tema],
                      tamanho: 200,
                      nome: 'Foco · ' + traduzirTema(tema)
                    });
                    setTela('criar');
                  }}
                />
              )}
              {!carregando && tela === 'analisar' && (
                <TelaAnalisarJogador
                  tipoInicial={tipoAnalise}
                  ratingUsuario={ratingUsuario}
                  onCriarComTemas={(preset) => {
                    setPresetCriar(preset);
                    setTela('criar');
                  }}
                />
              )}
            </div>
          </div>

          <Footer />

          {mostraHelp && (
            <div className="modal-overlay" onClick={() => setMostraHelp(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()} style={{ maxWidth: 420 }}>
                <div className="serif bold fs-17 mb-12">Atalhos de teclado</div>
                <div className="vstack gap-6">
                  {[
                    ['1', 'Início'],
                    ['2', 'Evolução'],
                    ['?', 'Mostrar/esconder esta ajuda'],
                    ['Esc', 'Fechar overlays'],
                  ].map(([k, label]) => (
                    <div key={k} className="hstack gap-12">
                      <kbd className="num" style={{
                        background: 'var(--surface)', border: '1px solid var(--border)',
                        borderRadius: 4, padding: '2px 8px', minWidth: 32, textAlign: 'center',
                        fontSize: 12,
                      }}>{k}</kbd>
                      <span className="serif fs-13">{label}</span>
                    </div>
                  ))}
                </div>
                <div className="serif bold fs-13 mt-16 mb-8">No treino</div>
                <div className="vstack gap-6">
                  {[
                    ['Espaço', 'Pular puzzle'],
                    ['P', 'Pausar/retomar'],
                    ['Enter / →', 'Próximo puzzle (após feedback)'],
                    ['Esc', 'Cancelar lance pendente'],
                  ].map(([k, label]) => (
                    <div key={k} className="hstack gap-12">
                      <kbd className="num" style={{
                        background: 'var(--surface)', border: '1px solid var(--border)',
                        borderRadius: 4, padding: '2px 8px', minWidth: 32, textAlign: 'center',
                        fontSize: 12,
                      }}>{k}</kbd>
                      <span className="serif fs-13">{label}</span>
                    </div>
                  ))}
                </div>
                <button className="btn btn-ghost btn-block mt-16"
                  onClick={() => setMostraHelp(false)}>
                  Fechar
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* === RENDER === */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    console.log("✓ woodpecker.html pronto\nPuzzles: github.com/felipe-kliente360/woodpecker-puzzles\nRelease: v1.0-puzzles");





  </script>
</body>
</html>
