<body>
  <div id="root"></div>
  <div id="erro-overlay" style="display:none;position:fixed;left:14px;right:14px;bottom:14px;
       background:#2a0e0e;color:#ffd0d0;border:1px solid #5a2222;border-radius:10px;
       padding:14px 18px;font-family:'Courier New',monospace;font-size:12px;z-index:200;
       max-height:40vh;overflow:auto;line-height:1.5;"></div>
  <script>
    // Captura erros JS que de outra forma deixariam a tela em branco.
    (function() {
      const overlay = document.getElementById('erro-overlay');
      function mostrar(msg) {
        overlay.style.display = 'block';
        const linha = document.createElement('div');
        linha.textContent = '⚠ ' + msg;
        overlay.appendChild(linha);
      }
      window.addEventListener('error', e => {
        mostrar((e.message || 'erro') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', e => {
        mostrar('Promise rejeitada: ' + (e.reason && (e.reason.message || e.reason)));
      });
      window.addEventListener('load', () => {
        const faltando = [];
        if (typeof window.React === 'undefined') faltando.push('React');
        if (typeof window.ReactDOM === 'undefined') faltando.push('ReactDOM');
        if (typeof window.Chess === 'undefined') faltando.push('Chess (chess.js)');
        if (typeof window.Chessboard === 'undefined') faltando.push('Chessboard');
        if (typeof window.pako === 'undefined') faltando.push('pako');
        if (typeof window.Chart === 'undefined') faltando.push('Chart.js');
        if (faltando.length) mostrar('Dependências não carregaram: ' + faltando.join(', '));
      });
    })();
  </script>
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /* === HELPERS / CONSTANTES (de lib/wp-helpers.js) === */
    const {
      TEMAS, TEMAS_INSTRUTIVOS, FAIXAS_ORDER,
      SRS_DIAS_REVISAO, SRS_MIN_ERROS,
      gerarId, pad, formatarTempo, formatarTempoLongo, formatarNumero,
      traduzirTema, faixaDeRating, faixasNoIntervalo, faixasNecessarias,
      loadLS, saveLS, clearLS,
      ciclosDoConjunto, ultimoCiclo, corCss,
    } = window.WP_HELPERS;

    /* === CAMADA DE PERSISTÊNCIA (src/data/) ===
     * Store é a única forma autorizada de tocar localStorage daqui pra
     * frente. loadLS/saveLS/clearLS acima continuam funcionando (compat)
     * mas componentes novos devem usar Store.get/set/remove com chaves
     * em WP.Chaves — não strings literais.
     */
    const Store  = window.WP.Store;
    const Chaves = window.WP.Chaves;
    Store.migrar();

    /* === DOMAIN (src/domain/) === */
    const {
      embaralhar, determinaCorJogador, corDoTabuleiro,
      lanceUciParaSan, aplicarLanceSilencioso, sequenciaSan,
    } = window.WP.Puzzle;
    const { metricasAtividade, nivelDoRating, streakPorDia, streakAtual } = window.WP.Ciclo;
    const { calcularRatingSugerido, ratingUnificado } = window.WP.Rating;
    const { puzzlesDevidoRevisao } = window.WP.SRS;

    /* === HOOKS (src/hooks/) === */
    const {
      useTimer, useTimerComPausa, useKeyboardShortcuts,
      useJogoPuzzle, useCriarConjunto,
    } = window.WP.Hooks;

    /* === UI COMPONENTS extraídos (src/ui/*.jsx) === */
    const Promocao = window.WP.UI.Promocao;
    const HistoricoAnalises = window.WP.UI.HistoricoAnalises;

    /* === CONFIG === */
    const CONFIG = {
      base_url: "puzzles",
      faixas: {
        "600_800":   "puzzles_600_800.json.gz",
        "800_1000":  "puzzles_800_1000.json.gz",
        "1000_1200": "puzzles_1000_1200.json.gz",
        "1200_1400": "puzzles_1200_1400.json.gz",
        "1400_1600": "puzzles_1400_1600.json.gz",
        "1600_1800": "puzzles_1600_1800.json.gz",
        "1800_2000": "puzzles_1800_2000.json.gz",
        "2000_2800": "puzzles_2000_2800.json.gz",
        "manifest":  "manifest.json"
      }
    };

    /* === CACHE GLOBAL === */
    const cacheFaixas = {};

    /* embaralhar, determinaCorJogador, corDoTabuleiro: src/domain/puzzle.js */

    async function buscarFaixa(chave, onProgress) {
      if (cacheFaixas[chave]) return cacheFaixas[chave];
      const arquivo = CONFIG.faixas[chave];
      if (!arquivo) throw new Error("Faixa desconhecida: " + chave);
      const url = CONFIG.base_url + "/" + arquivo;
      if (onProgress) onProgress("Baixando puzzles " + chave.replace('_','–') + "...");
      const resp = await fetch(url);
      if (!resp.ok) throw new Error("Falha ao baixar " + arquivo + " (" + resp.status + ")");
      const buf = await resp.arrayBuffer();
      const tamMB = (buf.byteLength / (1024 * 1024)).toFixed(1);
      if (onProgress) onProgress("Descomprimindo " + chave.replace('_','–') + " (" + tamMB + " MB)...");
      const txt = pako.inflate(new Uint8Array(buf), { to: 'string' });
      const json = JSON.parse(txt);
      const lista = Array.isArray(json) ? json : (json.puzzles || []);
      cacheFaixas[chave] = lista;
      return lista;
    }

    async function montarConjunto(rating, variacao, temas, tamanho, onProgress) {
      const FLOOR = 600, CEIL = 2800;
      const STEP = 100;

      // Quanto podemos expandir em cada direção a partir do rating
      const maxDown = Math.max(0, rating - FLOOR);
      const maxUp   = Math.max(0, CEIL - rating);

      // Variações iniciais — limitadas pelos extremos
      let varDown = Math.min(variacao, maxDown);
      let varUp   = Math.min(variacao, maxUp);

      const chavesBaixadas = new Set();
      const passos = []; // ['fetch:1200_1400', ...]
      let todos = [];
      let filtrados = [];
      let expandiu = false;

      const filtrar = (min, max) => todos.filter(p => {
        const r = p.rating || 0;
        if (r < min || r > max) return false;
        if (temas && temas.length > 0) {
          const pTemas = p.temas || p.themes || [];
          if (!pTemas.some(t => temas.includes(t))) return false;
        }
        return true;
      });

      const tentarRange = async () => {
        const min = rating - varDown;
        const max = rating + varUp;
        const chaves = faixasNoIntervalo(min, max);
        for (const k of chaves) {
          if (!chavesBaixadas.has(k)) {
            const lista = await buscarFaixa(k, onProgress);
            todos = todos.concat(lista);
            chavesBaixadas.add(k);
          }
        }
        filtrados = filtrar(min, max);
        return { chaves, min, max };
      };

      onProgress && onProgress("Calculando faixas necessárias...");
      let { chaves, min, max } = await tentarRange();
      onProgress && onProgress("Filtrando por rating e temas...");

      // Expansão automática se faltar puzzles
      while (filtrados.length < tamanho) {
        const podeDescer = varDown < maxDown;
        const podeSubir  = varUp   < maxUp;
        if (!podeDescer && !podeSubir) break;
        if (podeDescer) varDown = Math.min(maxDown, varDown + STEP);
        if (podeSubir)  varUp   = Math.min(maxUp,   varUp   + STEP);
        expandiu = true;
        const lado = (!podeDescer) ? "para cima"
                  : (!podeSubir)   ? "para baixo"
                  : "para ambos os lados";
        onProgress && onProgress("Poucos puzzles — expandindo " + lado + " (" + (rating - varDown) + "–" + (rating + varUp) + ")...");
        const r = await tentarRange();
        chaves = r.chaves; min = r.min; max = r.max;
      }

      onProgress && onProgress("Embaralhando " + filtrados.length + " puzzles...");
      filtrados = embaralhar(filtrados);
      const escolhidos = filtrados.slice(0, tamanho);
      const dist = {};
      for (const p of escolhidos) {
        for (const t of (p.temas || p.themes || [])) {
          dist[t] = (dist[t] || 0) + 1;
        }
      }
      const ratingMedio = escolhidos.length
        ? Math.round(escolhidos.reduce((a, p) => a + (p.rating || 0), 0) / escolhidos.length)
        : 0;
      onProgress && onProgress(escolhidos.length < tamanho
        ? "⚠ Apenas " + escolhidos.length + " puzzles disponíveis"
        : "✓ Conjunto montado!");
      return {
        puzzles: escolhidos,
        stats: {
          total_encontrado: filtrados.length,
          rating_medio: ratingMedio,
          dist_temas: dist,
          faixas_usadas: chaves,
          expandido: expandiu,
          variacao_efetiva: { down: varDown, up: varUp },
          range_efetivo: { min, max },
          tamanho_pedido: tamanho
        }
      };
    }

    /* nivelDoRating: src/domain/ciclo.js */

    /* loadLS, saveLS, clearLS, ciclosDoConjunto, ultimoCiclo: lib/wp-helpers.js */

    /* === EXPORT / IMPORT === */
    const CHAVES_LS_BACKUP = [
      Chaves.CONJUNTOS, Chaves.CICLOS,
      Chaves.SESSAO, Chaves.AUTO_BACKUP,
    ];

    // Limpa chave legada de modo confirmar (era persistida em versão anterior)
    try { localStorage.removeItem('wp_modo_confirmar'); } catch (e) {}

    function exportarBackup() {
      const dados = { versao: '1.0', gerado_em: new Date().toISOString(), app: 'woodpecker' };
      for (const k of CHAVES_LS_BACKUP) {
        const v = Store.get(k, null);
        if (v !== null) dados[k] = v;
      }
      const json = JSON.stringify(dados, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const dt = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      a.download = 'woodpecker-backup-' + dt + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // modo: 'merge' (mescla por id) ou 'replace' (sobrescreve tudo)
    function importarBackup(textoJson, modo) {
      const dados = JSON.parse(textoJson);
      if (dados.app !== 'woodpecker') {
        throw new Error('Arquivo não é um backup do Woodpecker (campo "app" ausente).');
      }
      if (!Array.isArray(dados.wp_conjuntos)) {
        throw new Error('Backup inválido: wp_conjuntos não é um array.');
      }
      if (modo === 'replace') {
        for (const k of CHAVES_LS_BACKUP) {
          if (dados[k] !== undefined) Store.set(k, dados[k]);
        }
        return { adicionados_conjuntos: dados.wp_conjuntos.length, adicionados_ciclos: (dados.wp_ciclos || []).length, modo };
      }
      // merge
      const conjuntosAtuais = Store.get(Chaves.CONJUNTOS, []);
      const ciclosAtuais = Store.get(Chaves.CICLOS, []);
      const idsConj = new Set(conjuntosAtuais.map(c => c.id));
      const idsCic = new Set(ciclosAtuais.map(c => c.id));
      const novosConj = (dados.wp_conjuntos || []).filter(c => !idsConj.has(c.id));
      const novosCic = (dados.wp_ciclos || []).filter(c => !idsCic.has(c.id));
      Store.set(Chaves.CONJUNTOS, conjuntosAtuais.concat(novosConj));
      Store.set(Chaves.CICLOS, ciclosAtuais.concat(novosCic));
      return { adicionados_conjuntos: novosConj.length, adicionados_ciclos: novosCic.length, modo };
    }

    /* === CALIBRAÇÃO === */
    // Sugere rating com base na curva de acerto vs rating observada.
    // Estratégia: agrupa os puzzles em brackets de 200 pontos, calcula a taxa
    // de acerto em cada um, e procura o bracket onde a taxa cai pra perto de
    // 60% — esse é o ponto de "desafio gravando" do método (acerta a maioria
    // mas com esforço). Fallback: média dos corretos com ajuste por taxa.
    /* calcularRatingSugerido: src/domain/rating.js */

    /* puzzlesDevidoRevisao: src/domain/srs.js */

    /* ratingUnificado: src/domain/rating.js */
    /* metricasAtividade: src/domain/ciclo.js */
    /* lanceUciParaSan, aplicarLanceSilencioso, sequenciaSan: src/domain/puzzle.js */

    /* === COMPONENTE ChessBoard (wrapper Chessboard.js) === */
    function ChessBoardView({ boardId, fen, orientation, onDrop, onSquareClick, onPickPiece, onDragEnd, draggable, highlightFrom, highlightTo, selectedSquare, errorFrom, errorTo, successTo, possibleMoves, possibleCaptures }) {
      const onDropRef = useRef(onDrop);
      const onSquareClickRef = useRef(onSquareClick);
      const onPickPieceRef = useRef(onPickPiece);
      const onDragEndRef = useRef(onDragEnd);
      const draggableRef = useRef(draggable !== false);
      const boardRef = useRef(null);
      useEffect(() => { onDropRef.current = onDrop; }, [onDrop]);
      useEffect(() => { onSquareClickRef.current = onSquareClick; }, [onSquareClick]);
      useEffect(() => { onPickPieceRef.current = onPickPiece; }, [onPickPiece]);
      useEffect(() => { onDragEndRef.current = onDragEnd; }, [onDragEnd]);
      useEffect(() => { draggableRef.current = draggable !== false; }, [draggable]);

      // Aplica/remove highlights. 4 tipos: origem/destino do último lance
      // do adversário (âmbar), casa selecionada via tap (azul + anel),
      // origem/destino do lance errado (vermelho).
      useEffect(() => {
        if (!boardRef.current) return;
        const apply = () => {
          try {
            const $root = window.jQuery && window.jQuery('#' + boardId);
            if (!$root || !$root.length) return;
            $root.find('.highlight-last-from').removeClass('highlight-last-from');
            $root.find('.highlight-last-to').removeClass('highlight-last-to');
            $root.find('.selected-square').removeClass('selected-square');
            $root.find('.highlight-error-from').removeClass('highlight-error-from');
            $root.find('.highlight-error-to').removeClass('highlight-error-to');
            $root.find('.highlight-success-to').removeClass('highlight-success-to');
            $root.find('.possible-move').removeClass('possible-move');
            $root.find('.possible-capture').removeClass('possible-capture');
            if (highlightFrom) $root.find('.square-' + highlightFrom).addClass('highlight-last-from');
            if (highlightTo)   $root.find('.square-' + highlightTo).addClass('highlight-last-to');
            if (selectedSquare) $root.find('.square-' + selectedSquare).addClass('selected-square');
            if (errorFrom)     $root.find('.square-' + errorFrom).addClass('highlight-error-from');
            if (errorTo)       $root.find('.square-' + errorTo).addClass('highlight-error-to');
            if (successTo)     $root.find('.square-' + successTo).addClass('highlight-success-to');
            if (possibleMoves) {
              for (const sq of possibleMoves) $root.find('.square-' + sq).addClass('possible-move');
            }
            if (possibleCaptures) {
              for (const sq of possibleCaptures) $root.find('.square-' + sq).addClass('possible-capture');
            }
          } catch (e) {}
        };
        const t = setTimeout(apply, 60);
        return () => clearTimeout(t);
      }, [highlightFrom, highlightTo, selectedSquare, errorFrom, errorTo, successTo, possibleMoves, possibleCaptures, fen, boardId]);

      useEffect(() => {
        const cfg = {
          draggable: true,
          position: fen || 'start',
          orientation: orientation || 'white',
          // Peças cburnett (Lichess) em SVG: legibilidade muito superior aos
          // PNGs Wikipedia da chessboardjs default. Servidos pelo CDN do Lichess.
          pieceTheme: 'https://lichess1.org/assets/piece/cburnett/{piece}.svg',
          // Animações mais ágeis pra sensação de fluidez no toque/drag
          moveSpeed: 140,
          snapbackSpeed: 80,
          snapSpeed: 30,
          onDragStart: (source, piece) => {
            if (!draggableRef.current) return false;
            // Avisa o hook pra mostrar bolinhas de lances possíveis durante o drag.
            if (onPickPieceRef.current) {
              try { onPickPieceRef.current(source); } catch (e) {}
            }
          },
          onDrop: (source, target) => {
            // Drag terminou (drop válido ou snapback). Limpa o arrastando
            // pra sumir as bolinhas. Acontece SEMPRE, mesmo no caso de tap
            // que terminou em snapback.
            if (onDragEndRef.current) {
              try { onDragEndRef.current(); } catch (e) {}
            }
            if (source === target) return 'snapback';
            const r = onDropRef.current && onDropRef.current(source, target);
            if (r === false) return 'snapback';
          }
        };
        boardRef.current = window.Chessboard(boardId, cfg);

        // Tap-to-move robusto: chessboard.js intercepta click via mousedown handlers
        // pra começar o drag, então um listener "click" puro nem sempre dispara.
        // Solução: rastrear pointerdown/pointerup (ou mouse/touch como fallback) e
        // só considerar tap quando press+release acontecem na mesma casa, sem
        // movimento significativo entre os dois (drag emite movimento >> 8px).
        const $ = window.jQuery;
        const $board = $ && $('#' + boardId);
        let downSq = null, downX = 0, downY = 0;
        // Em devices touch, cada tap dispara DUAS sequências:
        // 1) touchstart/touchend (imediato)
        // 2) mousedown/mouseup sintetizados (~300ms depois)
        // Sem guarda, a sequência 2 chama onSquareClick de novo no mesmo
        // square, destogglando a seleção feita pela sequência 1. lastTouchT
        // marca o último evento de touch — se um mouse event chega em <700ms,
        // ele é sintetizado e a gente ignora.
        let lastTouchT = 0;
        function getXY(e) {
          const oe = e.originalEvent || e;
          if (oe.touches && oe.touches[0]) return [oe.touches[0].clientX, oe.touches[0].clientY];
          if (oe.changedTouches && oe.changedTouches[0]) return [oe.changedTouches[0].clientX, oe.changedTouches[0].clientY];
          return [oe.clientX || 0, oe.clientY || 0];
        }
        function ehSintetizado(e) {
          const tipo = (e.originalEvent || e).type || '';
          const ehTouch = tipo.indexOf('touch') === 0;
          if (ehTouch) {
            lastTouchT = Date.now();
            return false;
          }
          // mouse event: se veio logo depois de touch, é sintetizado
          return (Date.now() - lastTouchT) < 700;
        }
        function onDown(e) {
          if (!draggableRef.current) return;
          if (ehSintetizado(e)) return;
          const sq = e.currentTarget && e.currentTarget.getAttribute('data-square');
          if (!sq) return;
          downSq = sq;
          [downX, downY] = getXY(e);
        }
        // onDocUp no document — mouseup pode disparar no draggedPiece (body),
        // fora do $board, então jQuery delegation em $board nunca pega.
        // Capturamos downSq no mousedown (antes do draggedPiece existir) e
        // checamos dx/dy aqui, sem precisar saber o target atual.
        function onDocUp(e) {
          if (!downSq) return;
          if (ehSintetizado(e)) { downSq = null; return; }
          const [x, y] = getXY(e);
          const dx = Math.abs(x - downX);
          const dy = Math.abs(y - downY);
          if (dx < 16 && dy < 16) {
            if (onSquareClickRef.current) onSquareClickRef.current(downSq);
          }
          downSq = null;
        }
        if ($board && $board.length) {
          $board.on('mousedown touchstart', '[data-square]', onDown);
        }
        document.addEventListener('mouseup', onDocUp);
        document.addEventListener('touchend', onDocUp);

        const onResize = () => { try { boardRef.current && boardRef.current.resize(); } catch (e) {} };
        window.addEventListener('resize', onResize);
        const t = setTimeout(onResize, 80);
        return () => {
          if ($board && $board.length) {
            try {
              $board.off('mousedown touchstart', '[data-square]', onDown);
            } catch (e) {}
          }
          document.removeEventListener('mouseup', onDocUp);
          document.removeEventListener('touchend', onDocUp);
          window.removeEventListener('resize', onResize);
          clearTimeout(t);
          try { boardRef.current && boardRef.current.destroy(); } catch (e) {}
          boardRef.current = null;
        };
      }, [boardId]);

      useEffect(() => {
        if (boardRef.current && fen) {
          // Anima a transição entre FENs (lance do adversário, troca de
          // puzzle). Sem animação, peças "teleportam" e o jogador perde
          // referência visual do que mudou.
          try { boardRef.current.position(fen, true); } catch (e) {}
        }
      }, [fen]);

      useEffect(() => {
        if (boardRef.current && orientation) {
          try {
            if (boardRef.current.orientation() !== orientation) {
              boardRef.current.orientation(orientation);
            }
          } catch (e) {}
        }
      }, [orientation]);

      return <div id={boardId} className="board-host"></div>;
    }

    /* ==========================================================================
       === COMPONENTES WP — DESIGN SYSTEM DA REPAGINAÇÃO ===
       Design tokens em src/styles/tokens.css; classes auxiliares em base.css
       (.wp-mono, .wp-display, .wp-eyebrow, .wp-tally, .wp-divider) e
       components.css (.wp-btn*, .wp-card, .wp-tabbar). Todos sem emoji
       (handoff é zen — ícones são SVG via WpIcon).
       ========================================================================== */

    function WpButton({ variant = 'outline', full, children, className = '', ...rest }) {
      const cls = 'wp-btn' +
        (variant === 'primary' ? ' wp-btn--primary' : '') +
        (variant === 'ghost'   ? ' wp-btn--ghost'   : '') +
        (full ? ' wp-btn--full' : '') +
        (className ? ' ' + className : '');
      return <button className={cls} {...rest}>{children}</button>;
    }

    function WpInput({ prefix, mono, className = '', ...rest }) {
      const cls = 'wp-input' +
        (mono ? ' wp-mono' : '') +
        (prefix ? ' wp-input--prefixed' : '') +
        (className ? ' ' + className : '');
      if (!prefix) return <input className={cls} {...rest} />;
      return (
        <div className="wp-input-wrap">
          <span className="wp-input-prefix wp-mono">{prefix}</span>
          <input className={cls} {...rest} />
        </div>
      );
    }

    function WpCard({ selected, onClick, children, as: Tag = 'div', className = '', ...rest }) {
      const cls = 'wp-card' +
        (selected ? ' wp-card--selected' : '') +
        (onClick ? ' wp-card--button' : '') +
        (className ? ' ' + className : '');
      return <Tag className={cls} onClick={onClick} {...rest}>{children}</Tag>;
    }

    /* Marcas verticais (motivo pica-pau). total marcas, primeiras `done` opacas. */
    function WpTally({ total = 10, done = 0, height, gap, color, style }) {
      const marks = [];
      for (let i = 0; i < total; i++) {
        const on = i < done;
        marks.push(<i key={i} className={on ? 'on' : ''} style={height ? { height: height + 'px' } : undefined} />);
      }
      const wrapStyle = { ...style };
      if (gap !== undefined) wrapStyle.gap = gap + 'px';
      if (color) wrapStyle.color = color;
      return <span className="wp-tally" style={wrapStyle}>{marks}</span>;
    }

    function WpEyebrow({ children, className = '', ...rest }) {
      return <div className={'wp-eyebrow' + (className ? ' ' + className : '')} {...rest}>{children}</div>;
    }

    function WpBigNumber({ value, size = 64, color, className = '', style }) {
      const s = { fontSize: size + 'px', lineHeight: 0.95, ...(color ? { color } : {}), ...(style || {}) };
      return <span className={'wp-bignum wp-mono' + (className ? ' ' + className : '')} style={s}>{value}</span>;
    }

    /* Set de ícones SVG stroke 1.6 (handoff). Não usa lucide-react porque o
       app é zero-build; melhor inline pra controle e zero rede extra. */
    const WP_ICON_PATHS = {
      'arrow-left':   <path d="M15 6l-6 6 6 6" />,
      'chevron-right':<path d="M9 6l6 6-6 6" />,
      'chevron-down': <path d="M6 9l6 6 6-6" />,
      'close':        <g><path d="M6 6l12 12" /><path d="M18 6l-12 12" /></g>,

      'list':         <g><path d="M8 6h12" /><path d="M8 12h12" /><path d="M8 18h12" /><circle cx="4" cy="6" r="0.6" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="0.6" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="0.6" fill="currentColor" stroke="none"/></g>,
      'chart':        <g><path d="M4 20V8" /><path d="M10 20V4" /><path d="M16 20v-8" /><path d="M22 20H2" /></g>,

      'clock':        <g><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 3" /></g>,
      'play':         <path d="M8 5v14l11-7z" />,
      'pause':        <g><path d="M9 5v14" /><path d="M15 5v14" /></g>,
      'flame':        <path d="M12 3c1 4 5 5 5 10a5 5 0 11-10 0c0-3 2-4 2-7 1 1 2 2 3 4z" />,
      'target':       <g><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="5" /><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none" /></g>,
      'settings':     <g><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" /></g>,
      'board':        <g><rect x="3" y="3" width="18" height="18" rx="1" /><path d="M3 9h18M3 15h18M9 3v18M15 3v18" /></g>,
      'hint':         <g><path d="M12 3a6 6 0 016 6c0 2.5-1.5 4-2.5 5.2-.5.6-.8 1.1-.8 1.8H9.3c0-.7-.3-1.2-.8-1.8C7.5 13 6 11.5 6 9a6 6 0 016-6z" /><path d="M10 21h4" /></g>,
      'x':            <g><path d="M6 6l12 12" /><path d="M18 6l-12 12" /></g>,
    };
    function WpIcon({ name, size = 18, strokeWidth = 1.6, className = '', style }) {
      const inner = WP_ICON_PATHS[name] || null;
      return (
        <svg
          width={size} height={size} viewBox="0 0 24 24"
          fill="none" stroke="currentColor"
          strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
          className={className} style={style} aria-hidden="true"

    /* === TELA INÍCIO === */

    /* === SETTINGS MODAL ===
     * Modal único acessível pelo ⚙ no header. Reúne configurações do
     * app: áudio, cadência da pausa (bloco-N), backup. Substitui a
     * antiga SecaoBackup que ficava no rodapé da TelaInicio. */
    function SettingsModal({ audioOn, onToggleAudio, onAposImport, onFechar }) {
      const [autoBackup, setAutoBackup] = useState(() => Store.get(Chaves.AUTO_BACKUP, false));
      const [bloco, setBloco] = useState(() => Store.get(Chaves.BLOCO_TAMANHO, 50));
      const [erro, setErro] = useState(null);
      const [aviso, setAviso] = useState(null);
      const fileRef = useRef(null);

      useEffect(() => { Store.set(Chaves.AUTO_BACKUP, autoBackup); }, [autoBackup]);
      useEffect(() => { Store.set(Chaves.BLOCO_TAMANHO, bloco); }, [bloco]);

      function aoExportar() {
        try {
          exportarBackup();
          setAviso('Backup exportado.');
          setErro(null);
          setTimeout(() => setAviso(null), 4000);
        } catch (e) { setErro(e.message || String(e)); }
      }

      function aoSelecionarArquivo(e) {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = (ev) => {
          try {
            const conjuntosAtuais = Store.get(Chaves.CONJUNTOS, []);
            const modo = conjuntosAtuais.length === 0
              ? 'replace'
              : (confirm('Já existem conjuntos no app. OK para mesclar (mantém os atuais e adiciona novos por id) · Cancelar para sobrescrever tudo.') ? 'merge' : 'replace');
            const r2 = importarBackup(ev.target.result, modo);
            setErro(null);
            setAviso('Importado: ' + r2.adicionados_conjuntos + ' conjuntos · ' + r2.adicionados_ciclos + ' ciclos.');
            if (onAposImport) onAposImport();
          } catch (err) {
            setErro('Falha ao importar: ' + (err.message || err));
            setAviso(null);
          }
        };
        r.readAsText(f);
        e.target.value = '';
      }

      return (
        <div className="modal-overlay" onClick={onFechar}>
          <div className="modal-card" onClick={e => e.stopPropagation()} style={{ maxWidth: 480 }}>
            <div className="between mb-12">
              <div className="serif bold fs-17">Configurações</div>
              <button className="btn btn-small ghost" onClick={onFechar}>✕</button>
            </div>

            {/* Áudio */}
            <div className="card-soft mb-12">
              <div className="mono fs-10 ls-2 txt-muted mb-4">ÁUDIO</div>
              <label className="hstack gap-8" style={{ cursor: 'pointer', userSelect: 'none' }}>
                <input type="checkbox" checked={audioOn} onChange={onToggleAudio}
                  style={{ width: 14, height: 14 }} />
                <span className="serif fs-13 txt-mid">Companion áudio — toques curtos no acerto/erro</span>
              </label>
            </div>

            {/* Cadência da pausa */}
            <div className="card-soft mb-12">
              <div className="mono fs-10 ls-2 txt-muted mb-4">CADÊNCIA DA PAUSA</div>
              <div className="hstack gap-8 mt-4 flex-wrap" style={{ alignItems: 'center' }}>
                <span className="serif fs-13 txt-mid">A cada</span>
                <div className="segmented">
                  {[25, 50, 100].map(n => (
                    <button key={n} className={bloco === n ? 'active' : ''} onClick={() => setBloco(n)}>{n}</button>
                  ))}
                </div>
                <span className="mono fs-10 txt-muted">
                  {bloco === 25 ? 'micro-cerimônia' : 'reflexão escrita opcional'}
                </span>
              </div>
            </div>

            {/* Backup */}
            <div className="card-soft mb-12">
              <div className="mono fs-10 ls-2 txt-muted mb-4">BACKUP</div>
              <div className="serif fs-12 txt-muted mb-12" style={{ lineHeight: 1.5 }}>
                Os dados ficam só neste navegador. Baixe periodicamente; em outro dispositivo, importe.
              </div>
              <div className="hstack gap-8 flex-wrap mb-12">
                <button className="btn btn-small" onClick={aoExportar}>↓ Exportar JSON</button>
                <button className="btn btn-small ghost" onClick={() => fileRef.current && fileRef.current.click()}>↑ Importar JSON</button>
                <input ref={fileRef} type="file" accept="application/json,.json" onChange={aoSelecionarArquivo} style={{ display: 'none' }} />
              </div>
              <label className="hstack gap-8" style={{ cursor: 'pointer', userSelect: 'none' }}>
                <input type="checkbox" checked={autoBackup} onChange={e => setAutoBackup(e.target.checked)}
                  style={{ width: 14, height: 14 }} />
                <span className="mono fs-11 txt-mid">Auto-backup ao concluir ciclo</span>
              </label>
              {erro && <div className="mono fs-11 txt-red mt-8">{erro}</div>}
              {aviso && <div className="mono fs-11 txt-green mt-8">{aviso}</div>}
            </div>
          </div>
        </div>
      );

    function MiniCardConjunto({ c, ciclos, onTreinar, onEvolucao }) {
      const cs = ciclosDoConjunto(ciclos, c.id);
      const ult = cs.length ? cs[cs.length - 1] : null;
      const horasDesde = ult && ult.data_fim ? (Date.now() - ult.data_fim) / 3600000 : null;
      const tempoLabel = horasDesde === null
        ? 'Ainda não iniciado'
        : (horasDesde < 1 ? 'há ' + Math.round(horasDesde * 60) + 'min'
          : horasDesde < 24 ? 'há ' + Math.round(horasDesde) + 'h'
          : 'há ' + Math.round(horasDesde / 24) + 'd');
      return (
        <div className="card-soft" style={{ padding: '14px 16px' }}>
          <div className="between mb-4" style={{ flexWrap: 'wrap', gap: 6 }}>
            <div className="serif bold fs-13" style={{ flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {c.nome}
            </div>
            <span className="badge">{c.tamanho}</span>
          </div>
          <div className="mono fs-11 txt-muted mb-8">
            {ult
              ? 'Ciclo ' + ult.numero + ' · ' + Math.round((ult.acertos/ult.total)*100) + '% · ' + formatarTempo(ult.tempo_medio_s) + ' médio · ' + tempoLabel

          <div className="hstack gap-6 flex-wrap">
            <button className="btn btn-small" onClick={() => onTreinar(c)}>▶ Treinar</button>

    /* === CALENDÁRIO DE STREAK ===
     * Heatmap dos últimos N dias (default 84 = 12 semanas). Cores por
     * intensidade do count de ciclos. Coluna mais à direita = hoje. */
    function CalendarioStreak({ ciclos, dias }) {
      dias = dias || 84;
      const grid = streakPorDia(ciclos, dias);
      const streak = streakAtual(ciclos);
      const totalCiclos = grid.reduce((a, d) => a + d.count, 0);
      const diasComCiclo = grid.filter(d => d.count > 0).length;
      function nivel(c) {
        if (c === 0) return '';
        if (c === 1) return ' lvl-1';
        if (c === 2) return ' lvl-2';
        return ' lvl-3';
      }
      return (
        <div className="card-soft mb-12" style={{ overflowX: 'auto' }}>
          <div className="between mb-8" style={{ flexWrap: 'wrap', gap: 8 }}>
            <div>
              <div className="mono fs-10 ls-2 txt-muted">SEUS ÚLTIMOS {dias} DIAS</div>
              <div className="serif bold fs-15">
                {streak > 0 ? streak + ' dia' + (streak > 1 ? 's' : '') + ' seguidos' : 'sem streak ativo'}
              </div>
            </div>
            <div className="mono fs-10 txt-muted" style={{ textAlign: 'right' }}>
              {diasComCiclo}/{dias} dias com ciclo · {totalCiclos} no total
            </div>
          </div>
          <div className="streak-grid" style={{ minWidth: 'fit-content' }}>
            {grid.map((d, i) => (
              <div key={d.data}
                className={'streak-cell' + nivel(d.count)}
                title={d.data + ' · ' + d.count + ' ciclo' + (d.count !== 1 ? 's' : '')} />
            ))}
          </div>
        </div>
      );
    }

    /* === IMPORT RATING CHESS.COM (LITE) ===
     * Fluxo curto pra fixar rating inicial sem analisar partidas. Hit no
     * /pub/player/{u}/stats e média ponderada via WP.Rating. */
    function ImportRatingChesscomModal({ onConfirmar, onFechar }) {
      const [u, setU] = useState('');
      const [carregando, setCarregando] = useState(false);
      const [erro, setErro] = useState(null);
      const [resultado, setResultado] = useState(null);

      async function buscar() {
        const username = u.trim();
        if (!username) return;
        setCarregando(true);
        setErro(null);
        setResultado(null);
        try {
          const resp = await fetch('https://api.chess.com/pub/player/' + encodeURIComponent(username.toLowerCase()) + '/stats');
          if (!resp.ok) {
            if (resp.status === 404) throw new Error('Usuário não encontrado no chess.com.');
            throw new Error('Falha ao buscar (HTTP ' + resp.status + ').');
          }
          const stats = await resp.json();
          const r = window.WP.Rating.ratingPonderadoChesscom(stats);
          if (!r) throw new Error('Sem rating em rapid/blitz/bullet — cadastre via "Já sei meu rating".');
          setResultado({ rating: r.rating, fontes: r.fontes, username: username });
        } catch (e) {
          setErro(e.message || String(e));
        } finally {
          setCarregando(false);
        }
      }

      function aplicar() {
        if (!resultado) return;
        onConfirmar(resultado.rating, resultado.username);
      }

      const labelTC = { rapid: 'Rapid', blitz: 'Blitz', bullet: 'Bullet' };

      return (
        <div className="modal-overlay" onClick={onFechar}>
          <div className="modal-card" onClick={e => e.stopPropagation()} style={{ maxWidth: 460 }}>
            <div className="mono fs-10 ls-2 txt-muted mb-4">IMPORTAR RATING · CHESS.COM</div>
            <div className="serif bold fs-17 mb-4">Qual é seu username?</div>
            <div className="serif fs-13 txt-mid mb-12">
              Buscamos seu rating atual em rapid, blitz e bullet — e fazemos a média ponderada nessa ordem.
            </div>
            <div className="hstack gap-8 mb-12">
              <input
                type="text"
                value={u}
                onChange={e => setU(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') buscar(); }}
                autoFocus
                placeholder="seu_usuario"
                spellCheck={false}
                autoCapitalize="none"
                style={{
                  flex: 1, background: 'var(--surface)', color: 'var(--txt)',
                  border: '1px solid var(--border)', borderRadius: 6,
                  padding: '8px 10px', fontFamily: "'Courier New', monospace", fontSize: 13,
                  outline: 'none',
                }} />
              <button className="btn btn-small" onClick={buscar} disabled={carregando || !u.trim()}>
                {carregando ? 'Buscando…' : 'Buscar'}
              </button>
            </div>

            {erro && <div className="mono fs-11 txt-red mb-12">✗ {erro}</div>}

            {resultado && (
              <div className="card-soft mb-12" style={{ borderLeft: '3px solid var(--green)' }}>
                <div className="mono fs-10 ls-2 txt-muted mb-4">RATING PONDERADO</div>
                <div className="serif bold num-display fs-22 mb-8">{resultado.rating}</div>
                <div className="vstack gap-4">
                  {resultado.fontes.map(f => (
                    <div key={f.time_class} className="hstack gap-8">
                      <span className="mono fs-11 txt-mid" style={{ width: 60 }}>{labelTC[f.time_class]}</span>
                      <span className="num fs-12 bold">{f.rating}</span>
                      <span className="mono fs-10 txt-muted" style={{ marginLeft: 'auto' }}>peso ×{f.peso}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="hstack gap-8">
              {resultado && (
                <button className="btn btn-primary" style={{ flex: 1 }} onClick={aplicar}>
                  ✓ Aplicar rating
                </button>
              )}
              <button className="btn btn-ghost btn-small" onClick={onFechar}>
                {resultado ? 'Cancelar' : 'Fechar'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* === WIZARD: CRIAR CONJUNTO ===
     * Modal único disparado pelo CTA "+ Criar conjunto" da TelaInicio.
     * 3 cards (padrão / pessoal / adversário). Pessoal e Adversário
     * desabilitados se !temChesscom. Após escolha, fecha e dispara o
     * callback correspondente — pipeline de criação roda como antes. */
    function WizardCriarConjunto({ temChesscom, onCriarPadrao, onCriarPessoal, onCriarAdversario, onFechar }) {
      function escolher(tipo) {
        onFechar();
        setTimeout(() => {
          if (tipo === 'padrao')         onCriarPadrao();
          else if (tipo === 'pessoal')    onCriarPessoal();
          else if (tipo === 'adversario') onCriarAdversario();
        }, 50);
      }
      return (
        <div className="modal-overlay" onClick={onFechar}>
          <div className="modal-card" onClick={e => e.stopPropagation()} style={{ maxWidth: 500 }}>
            <div className="mono fs-10 ls-2 txt-muted mb-4">CRIAR CONJUNTO</div>
            <div className="serif bold fs-17 mb-12">Que tipo de treino?</div>
            <div className="vstack gap-8">
              <button className="choice-card" onClick={() => escolher('padrao')}>
                <div className="choice-icon">♞</div>
                <div className="choice-title">Padrão</div>
                <div className="choice-desc">
                  Manutenção tática. Puzzles aleatórios na sua faixa de rating.
                </div>
              </button>
              <button className="choice-card"
                onClick={() => temChesscom && escolher('pessoal')}
                disabled={!temChesscom}
                style={!temChesscom ? { opacity: 0.45, cursor: 'not-allowed' } : null}
                title={!temChesscom ? 'Configure chess.com no rating primeiro' : ''}>
                <div className="choice-icon">🎯</div>
                <div className="choice-title">Plano pessoal</div>
                <div className="choice-desc">
                  Análise das suas partidas. Foca nas suas fraquezas reais.
                  {!temChesscom && <span className="txt-muted"> · requer chess.com</span>}
                </div>
              </button>
              <button className="choice-card"
                onClick={() => temChesscom && escolher('adversario')}
                disabled={!temChesscom}
                style={!temChesscom ? { opacity: 0.45, cursor: 'not-allowed' } : null}
                title={!temChesscom ? 'Configure chess.com no rating primeiro' : ''}>
                <div className="choice-icon">⚔</div>
                <div className="choice-title">Contra adversário</div>
                <div className="choice-desc">
                  Análise das partidas de um oponente. Foca nos pontos cegos dele.
                  {!temChesscom && <span className="txt-muted"> · requer chess.com</span>}
                </div>
              </button>
            </div>
            <button className="btn btn-ghost btn-block mt-12" onClick={onFechar}>
              Cancelar
            </button>
          </div>
        </div>
      );
    }

    /* === ONBOARDING MODAL ===
     * Primeiro acesso (sem rating + sem conjuntos + sem ciclos + nunca
     * dispensado). Pede o username do chess.com e puxa rating ponderado.
     * Depois o App auto-cria um conjunto inicial de 5 puzzles e inicia
     * o ciclo — onboarding = 3 ciclos de 5 pra demonstrar o método.
     * Calibragem fica disponível depois, na home. Pular cai na home
     * sem rating. */
    function OnboardingModal({ onConcluir, onPular }) {
      const [u, setU] = useState('');
      const [carregando, setCarregando] = useState(false);
      const [erro, setErro] = useState(null);
      const [resultado, setResultado] = useState(null);

      async function buscar() {
        const username = u.trim();
        if (!username) return;
        setCarregando(true);
        setErro(null);
        setResultado(null);
        try {
          const resp = await fetch('https://api.chess.com/pub/player/' + encodeURIComponent(username.toLowerCase()) + '/stats');
          if (!resp.ok) {
            if (resp.status === 404) throw new Error('Usuário não encontrado no chess.com.');
            throw new Error('Falha ao buscar (HTTP ' + resp.status + ').');
          }
          const stats = await resp.json();
          const r = window.WP.Rating.ratingPonderadoChesscom(stats);
          if (!r) throw new Error('Sem rating em rapid/blitz/bullet — pula por enquanto, calibra na home.');
          setResultado({ rating: r.rating, fontes: r.fontes, username: username });
        } catch (e) {
          setErro(e.message || String(e));
        } finally {
          setCarregando(false);
        }
      }

      function comecar() {
        if (!resultado) return;
        onConcluir(resultado.rating, resultado.username);
      }

      const labelTC = { rapid: 'Rapid', blitz: 'Blitz', bullet: 'Bullet' };

      return (
        <div className="modal-overlay">
          <div className="modal-card" style={{ maxWidth: 480 }}>
            <div className="mono fs-10 ls-2 txt-muted mb-4">BEM-VINDO</div>
            <div className="serif bold fs-22 mb-12" style={{ lineHeight: 1.25 }}>
              Repetição massiva de padrões táticos
            </div>
            <div className="serif fs-13 txt-mid mb-16" style={{ lineHeight: 1.55 }}>
              Você resolve o mesmo conjunto de puzzles várias vezes. O alvo é
              cortar o tempo total pela metade — <span className="bold">halving</span> — a cada repetição.
              Padrões que demoravam minutos viram reconhecimento instantâneo.
            </div>

            <div className="mono fs-10 ls-2 txt-muted mb-8">SEU USUÁRIO CHESS.COM</div>
            <div className="hstack gap-8 mb-8">
              <input
                type="text"
                value={u}
                onChange={e => { setU(e.target.value); setResultado(null); setErro(null); }}
                onKeyDown={e => { if (e.key === 'Enter') buscar(); }}
                autoFocus
                placeholder="seu_usuario"
                spellCheck={false}
                autoCapitalize="none"
                style={{
                  flex: 1, background: 'var(--surface)', color: 'var(--txt)',
                  border: '1px solid var(--border)', borderRadius: 6,
                  padding: '10px 12px', fontFamily: "'Courier New', monospace", fontSize: 14,
                  outline: 'none',
                }} />
              {!resultado && (
                <button className="btn btn-small" onClick={buscar} disabled={carregando || !u.trim()}>
                  {carregando ? 'Buscando…' : 'Buscar'}
                </button>
              )}
            </div>
            <div className="mono fs-10 txt-muted mb-12" style={{ lineHeight: 1.6 }}>
              Puxamos seu rating ponderado em rapid/blitz/bullet — fica como parâmetro do app.
            </div>

            {erro && <div className="mono fs-11 txt-red mb-12">✗ {erro}</div>}

            {resultado && (
              <div className="card-soft mb-12" style={{ borderLeft: '3px solid var(--green)' }}>
                <div className="mono fs-10 ls-2 txt-muted mb-4">RATING PONDERADO</div>
                <div className="serif bold num-display fs-22 mb-8">{resultado.rating}</div>
                <div className="vstack gap-4">
                  {resultado.fontes.map(f => (
                    <div key={f.time_class} className="hstack gap-8">
                      <span className="mono fs-11 txt-mid" style={{ width: 60 }}>{labelTC[f.time_class]}</span>
                      <span className="num fs-12 bold">{f.rating}</span>
                      <span className="mono fs-10 txt-muted" style={{ marginLeft: 'auto' }}>peso ×{f.peso}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {resultado ? (
              <div className="vstack gap-8">
                <div className="serif fs-13 txt-mid mb-4" style={{ lineHeight: 1.55 }}>
                  Vamos começar com um conjunto de <span className="bold">5 puzzles na sua faixa</span>.
                  Em 3 ciclos você sente o método na pele.
                </div>
                <button className="btn btn-primary btn-block" onClick={comecar}>
                  ▶ Começar com 5 puzzles
                </button>
              </div>
            ) : (
              <button className="btn btn-ghost btn-block" onClick={onPular}>
                Pular por enquanto
              </button>
            )}
          </div>
        </div>
      );
    }

    function TelaInicio({
      conjuntos, ciclos, ratingUsuario,
      onContinuar, onTreinar, onEvolucao, onTreinarApenasErros,
      onConcluirConjunto, onConcluir,
      onCriarPadrao, onCriarPessoal, onCriarAdversario,
      onCalibrar, onSetRatingChesscom, onSetChesscomUsername, onOnboardingConcluir,
      onIrParaConjuntos,
    }) {
      const Conjunto = window.WP.Conjunto;
      const ativos = useMemo(() => Conjunto.conjuntosAtivos(conjuntos), [conjuntos]);
      const podeNovo = ativos.length < Conjunto.LIMITE_ATIVOS;
      const temRating = !!(ratingUsuario && ratingUsuario.valor);
      const temChesscom = !!(ratingUsuario && ratingUsuario.chesscom);
      const [mostraImport, setMostraImport] = useState(false);
      const [mostraWizard, setMostraWizard] = useState(false);
      const [tentativaCriar, setTentativaCriar] = useState(null);
      // Edição inline do username chess.com (parâmetro persistente).
      const [editandoChesscom, setEditandoChesscom] = useState(false);
      const [chesscomDraft, setChesscomDraft] = useState('');

      // Onboarding: primeira visita = sem rating + sem conjuntos + sem
      // ciclos + nunca dispensado.
      const ehPrimeiroAcesso = !temRating && conjuntos.length === 0
        && ciclos.length === 0
        && !Store.get(Chaves.ONBOARDING_VISTO, false);
      const [mostraOnboarding, setMostraOnboarding] = useState(ehPrimeiroAcesso);

      function dispensarOnboarding() {
        Store.set(Chaves.ONBOARDING_VISTO, true);
        setMostraOnboarding(false);
      }

      const revisao = useMemo(() => puzzlesDevidoRevisao(ciclos, conjuntos), [ciclos, conjuntos]);

      function abrirWizard() {
        if (!temRating) return;
        if (!podeNovo) {
          setTentativaCriar('qualquer');
          return;
        }
        setMostraWizard(true);
      }

      function confirmarConcluirEAbrir(c) {
        onConcluirConjunto(c.id);
        setTentativaCriar(null);
        setTimeout(() => setMostraWizard(true), 80);
      }

      const fonteLabel = (f) => f === 'calibragem' ? 'calibragem'
                              : f === 'chesscom'   ? 'chess.com'
                              : 'manual';

      return (
        <div className="tela-container">
          {/* === RATING === */}
          {temRating ? (
            <div className="card-soft mb-16" style={{ borderLeft: '3px solid var(--primary)' }}>
              <div className="between" style={{ flexWrap: 'wrap', gap: 8 }}>
                <div>
                  <div className="mono fs-10 ls-2 txt-muted">SEU RATING</div>
                  <div className="hstack gap-8" style={{ alignItems: 'baseline' }}>
                    <div className="num-display num-xl txt-primary">{ratingUsuario.valor}</div>
                    <div className="mono fs-11 txt-muted">{nivelDoRating(ratingUsuario.valor)}</div>
                  </div>
                  <div className="mono fs-10 txt-muted mt-4">
                    fonte: {fonteLabel(ratingUsuario.fonte)}
                    {ratingUsuario.chesscom ? ' · ' + ratingUsuario.chesscom : ''}
                  </div>
                </div>
                <div className="vstack gap-4" style={{ alignItems: 'flex-end' }}>
                  <button className="btn btn-small ghost" onClick={onCalibrar}
                    title="Refazer calibragem (30 puzzles)">🎯 Calibrar</button>
                  <button className="btn btn-small ghost" onClick={() => setMostraImport(true)}
                    title="Importar/atualizar via chess.com">🔍 chess.com</button>
                </div>
              </div>
            </div>
          ) : (
            <div className="card mb-16">
              <div className="serif bold fs-15 mb-4">Defina seu rating</div>
              <div className="serif fs-13 txt-muted mb-16" style={{ lineHeight: 1.55 }}>
                Rating parametriza tudo: faixa de puzzles, plano pessoal, conjunto contra adversário.
              </div>
              <div className="vstack gap-10">
                <button className="choice-card" onClick={onCalibrar}>
                  <div className="choice-icon">🎯</div>
                  <div className="choice-title">Calibrar</div>
                  <div className="choice-desc">
                    30 puzzles em faixa ampla. O app sugere o rating onde você rende mais.
                  </div>
                </button>
                <button className="choice-card" onClick={() => setMostraImport(true)}>
                  <div className="choice-icon">🔍</div>
                  <div className="choice-title">Importar do chess.com</div>
                  <div className="choice-desc">
                    Lê seu perfil. Rating ponderado por rapid, blitz e bullet — sem analisar partidas.
                  </div>
                </button>
              </div>
            </div>
          )}

          {/* === CHESS.COM USERNAME (parâmetro definitivo) === */}
          {temRating && (
            <div className="card-soft mb-16">
              <div className="between" style={{ flexWrap: 'wrap', gap: 8 }}>
                <div style={{ minWidth: 0, flex: '1 1 200px' }}>
                  <div className="mono fs-10 ls-2 txt-muted">USUÁRIO CHESS.COM</div>
                  {!editandoChesscom ? (
                    <div className="hstack gap-8" style={{ alignItems: 'baseline', flexWrap: 'wrap' }}>
                      <div className="serif fs-15 bold" style={{ minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis' }}>
                        {temChesscom ? '@' + ratingUsuario.chesscom : '— (não definido)'}
                      </div>
                    </div>
                  ) : (
                    <div className="hstack gap-6 mt-4" style={{ flexWrap: 'wrap' }}>
                      <input type="text"
                        value={chesscomDraft}
                        onChange={e => setChesscomDraft(e.target.value)}
                        onKeyDown={e => {
                          if (e.key === 'Enter') {
                            if (onSetChesscomUsername) onSetChesscomUsername(chesscomDraft);
                            setEditandoChesscom(false);
                          } else if (e.key === 'Escape') {
                            setEditandoChesscom(false);
                          }
                        }}
                        autoFocus
                        placeholder="seu_usuario"
                        spellCheck={false}
                        autoCapitalize="none"
                        style={{
                          flex: '1 1 160px', background: 'var(--surface)', color: 'var(--txt)',
                          border: '1px solid var(--border)', borderRadius: 6,
                          padding: '6px 10px', fontFamily: "'Courier New', monospace", fontSize: 13,
                          outline: 'none',
                        }} />
                      <button className="btn btn-small"
                        onClick={() => {
                          if (onSetChesscomUsername) onSetChesscomUsername(chesscomDraft);
                          setEditandoChesscom(false);
                        }}>
                        Salvar
                      </button>
                      <button className="btn btn-small ghost"
                        onClick={() => setEditandoChesscom(false)}>
                        Cancelar
                      </button>
                    </div>
                  )}
                  <div className="mono fs-10 txt-muted mt-4">
                    {temChesscom
                      ? 'Usado pra puxar rating, criar Plano pessoal e Adversário.'
                      : 'Defina pra desbloquear Plano pessoal / Adversário.'}
                  </div>
                </div>
                {!editandoChesscom && (
                  <div className="vstack gap-4" style={{ alignItems: 'flex-end' }}>
                    <button className="btn btn-small ghost"
                      onClick={() => {
                        setChesscomDraft(temChesscom ? ratingUsuario.chesscom : '');
                        setEditandoChesscom(true);
                      }}
                      title={temChesscom ? 'Trocar de conta' : 'Adicionar username chess.com'}>
                      ✏ {temChesscom ? 'Trocar' : 'Adicionar'}
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* === CTA CRIAR CONJUNTO === */}
          {temRating && (
            <button className="btn btn-primary btn-block mb-16" onClick={abrirWizard}>
              + Criar conjunto
            </button>
          )}

          {/* === CONJUNTOS ATIVOS (com badges inline) === */}
          {ativos.length > 0 && (
            <div className="mb-16">
              <div className="between mb-8">
                <div className="mono fs-10 ls-2 txt-muted">
                  CONJUNTOS · {ativos.length}/{Conjunto.LIMITE_ATIVOS}
                </div>
                <button className="btn btn-small ghost" onClick={onContinuar}
                  title="Retoma sessão salva ou abre tela de conjuntos">
                  ▶ Continuar
                </button>
              </div>
              <div className="vstack gap-8">
                {ativos.map(c => {
                  const cs = ciclosDoConjunto(ciclos, c.id);
                  const status = Conjunto.prontoPraConcluir(c, ciclos);
                  const revC = revisao[c.id];
                  const meta = Conjunto.META_CICLOS[Conjunto.tipoDe(c)];
                  const cicloLabel = cs.length === 0
                    ? 'pronto pra Ciclo 1'
                    : 'ciclo ' + cs[cs.length - 1].numero + (meta ? ' / ' + meta : '');
                  return (
                    <div key={c.id} className="card-soft" style={{ padding: '12px 14px' }}>
                      <div className="hstack gap-8 between flex-wrap">
                        <div className="hstack gap-8" style={{ flex: '1 1 220px', minWidth: 0 }}>
                          <span className="serif fs-15" style={{ minWidth: 22, color: 'var(--gold)' }}>
                            {Conjunto.ICONES_TIPOS[Conjunto.tipoDe(c)] || '♞'}
                          </span>
                          <span className="serif fs-13 bold" style={{
                            flex: 1, minWidth: 0, overflow: 'hidden',
                            textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                          }}>
                            {c.nome}
                          </span>
                          {status.pronto && <span className="badge green">PRONTO</span>}
                          {revC && revC.devidos > 0 && (
                            <span className="badge amber">{revC.devidos} revisão</span>
                          )}
                        </div>
                        <div className="hstack gap-6 flex-wrap">
                          {status.pronto && (
                            <button className="btn btn-small" onClick={() => onConcluirConjunto(c.id)}>
                              ✓ Concluir
                            </button>
                          )}
                          {revC && revC.devidos > 0 && onTreinarApenasErros && (
                            <button className="btn btn-small ghost"
                              onClick={() => onTreinarApenasErros(c)}
                              title="Treinar só os puzzles errados">
                              ↻ Revisar
                            </button>
                          )}
                          <button className="btn btn-small" onClick={() => onTreinar(c)}>▶ Treinar</button>
                          <button className="btn btn-small ghost" onClick={() => onEvolucao(c)}>📊</button>
                        </div>
                      </div>
                      <div className="mono fs-10 txt-muted mt-4">
                        {Conjunto.NOMES_TIPOS[Conjunto.tipoDe(c)] || 'Padrão'} · {cicloLabel}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* === MODAIS === */}
          {mostraWizard && (
            <WizardCriarConjunto
              temChesscom={temChesscom}
              onCriarPadrao={onCriarPadrao}
              onCriarPessoal={onCriarPessoal}
              onCriarAdversario={onCriarAdversario}
              onFechar={() => setMostraWizard(false)} />
          )}

          {tentativaCriar && (
            <div className="modal-overlay" onClick={() => setTentativaCriar(null)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <div className="serif bold fs-17 mb-4">Limite de 3 conjuntos ativos</div>
                <div className="serif fs-13 txt-mid mb-16" style={{ lineHeight: 1.55 }}>
                  Marque um como concluído pra liberar vaga:
                </div>
                <div className="vstack gap-6 mb-16">
                  {ativos.map(c => (
                    <button key={c.id}
                      onClick={() => confirmarConcluirEAbrir(c)}
                      style={{
                        textAlign: 'left', cursor: 'pointer',
                        background: 'var(--surface)',
                        border: '1px solid var(--border)',
                        borderRadius: 6,
                        padding: '8px 12px',
                      }}>
                      <div className="hstack gap-6">
                        <span style={{ color: 'var(--gold)' }}>
                          {Conjunto.ICONES_TIPOS[Conjunto.tipoDe(c)]}
                        </span>
                        <span className="serif fs-13 bold">{c.nome}</span>
                      </div>
                      <div className="mono fs-10 txt-muted mt-4">
                        Concluir e abrir wizard →
                      </div>
                    </button>
                  ))}
                </div>
                <button className="btn btn-ghost btn-block"
                  onClick={() => setTentativaCriar(null)}>
                  Cancelar
                </button>
              </div>
            </div>
          )}

          {mostraImport && (
            <ImportRatingChesscomModal
              onConfirmar={(rating, username) => {
                if (onSetRatingChesscom) onSetRatingChesscom(rating, username);
                setMostraImport(false);
                Store.set(Chaves.ONBOARDING_VISTO, true);
              }}
              onFechar={() => setMostraImport(false)} />
          )}

          {mostraOnboarding && (
            <OnboardingModal
              onConcluir={(rating, username) => {
                dispensarOnboarding();
                if (onOnboardingConcluir) onOnboardingConcluir(rating, username);
              }}
              onPular={dispensarOnboarding} />
          )}
        </div>
      );
    }

    /* === TELA MEUS CONJUNTOS === */
    function CardConjunto({ c, ciclos, onTreinar, onEvolucao, onExcluir, onAtualizar }) {
      const cs = ciclosDoConjunto(ciclos, c.id);
      const ult = cs.length ? cs[cs.length - 1] : null;
      const [editandoNota, setEditandoNota] = useState(false);
      const [textoNota, setTextoNota] = useState(c.notas || '');
      const temNota = (c.notas || '').trim().length > 0;

      function salvarNota() {
        onAtualizar({ ...c, notas: textoNota.trim() });
        setEditandoNota(false);
      }
      function cancelarNota() {
        setTextoNota(c.notas || '');
        setEditandoNota(false);
      }

      return (
        <div className="card">
          <div className="between mb-8" style={{ flexWrap: 'wrap', gap: 8 }}>
            <div className="serif bold fs-15">{c.nome}</div>
            <span className="badge">{c.tamanho} puzzles</span>
          </div>
          <div className="mono fs-10 txt-muted mb-8">
            Rating: {formatarNumero(c.rating)} · Variação: ±{c.variacao}
          </div>
          {c.temas && c.temas.length > 0 && (
            <div className="hstack flex-wrap gap-6 mb-12">
              {c.temas.slice(0, 4).map(t => (
                <span key={t} className="badge">{traduzirTema(t)}</span>
              ))}
              {c.temas.length > 4 && <span className="badge">+{c.temas.length - 4}</span>}
            </div>
          )}
          {ult ? (
            <div className="mono fs-12 txt-muted mb-12">
              Ciclo {ult.numero} · Acertos: {Math.round((ult.acertos/ult.total)*100)}% · Tempo médio: {formatarTempo(ult.tempo_medio_s)}
            </div>
          ) : (
            <div className="mono fs-12 txt-muted italic mb-12">Ainda não iniciado</div>
          )}

          {editandoNota ? (
            <div className="mb-12">
              <div className="input-label">Notas</div>
              <textarea
                value={textoNota}
                onChange={e => setTextoNota(e.target.value)}
                placeholder="Ex: focado em finais de torres, ciclo 4 marcou meu PR..."
                rows={3}
                style={{
                  width: '100%', resize: 'vertical',
                  background: 'var(--surface)', color: 'var(--txt)',
                  border: '1px solid var(--border)', borderRadius: 6,
                  padding: '8px 10px', fontFamily: 'Georgia, serif', fontSize: 13,
                  lineHeight: 1.5, outline: 'none'
                }} />
              <div className="hstack gap-8 mt-8">
                <button className="btn btn-small" onClick={salvarNota}>Salvar</button>
                <button className="btn btn-small ghost" onClick={cancelarNota}>Cancelar</button>
              </div>
            </div>
          ) : temNota ? (
            <div onClick={() => setEditandoNota(true)}
              className="card-soft mb-12"
              style={{ cursor: 'pointer', borderLeft: '3px solid var(--gold)' }}>
              <div className="mono fs-10 txt-muted ls-2 mb-4">📝 NOTAS</div>
              <div className="serif fs-13" style={{ whiteSpace: 'pre-wrap' }}>{c.notas}</div>
            </div>
          ) : null}

          <div className="hstack gap-8 flex-wrap">
            <button className="btn btn-small" onClick={() => onTreinar(c)}>▶ Treinar</button>
            <button className="btn btn-small ghost" onClick={() => onEvolucao(c)}>📊 Evolução</button>
            {!editandoNota && !temNota && (
              <button className="btn btn-small ghost" onClick={() => setEditandoNota(true)}>📝 Notas</button>
            )}
            <button className="btn btn-small danger" onClick={() => {
              if (confirm('Excluir o conjunto "' + c.nome + '"? Isso apaga também os ciclos.')) {
                onExcluir(c.id);
              }
            }}>🗑</button>
          </div>
        </div>
      );
    }

    function TelaConjuntos({ conjuntos, ciclos, onTreinar, onEvolucao, onExcluir, onAtualizar, onCriar }) {
      return (
        <div className="tela-container wide">
          <div className="between mb-16">
            <div className="serif bold fs-17">Meus Conjuntos</div>
            <button className="btn btn-small" onClick={onCriar}>+ Novo</button>
          </div>

          {conjuntos.length === 0 ? (
            <div className="card center">
              <div style={{ fontSize: 36, color: 'var(--txt-muted)', marginBottom: 12 }}>♟</div>
              <div className="serif fs-13 txt-muted mb-16">Nenhum conjunto criado ainda</div>
              <button className="btn btn-primary" onClick={onCriar}>+ Criar Conjunto</button>
            </div>

            <div className="vstack gap-12">
              {conjuntos.map(c => (
                <CardConjunto key={c.id} c={c} ciclos={ciclos}
                  onTreinar={onTreinar} onEvolucao={onEvolucao}

              ))}
            </div>
          )}
