    }

    /* === TELA CRIAR (WIZARD 3 PASSOS) === */
    function StepBar({ passo }) {
      const labels = ['Rating', 'Temas', 'Tamanho'];
      return (
        <div className="stepper">
          {labels.map((lbl, i) => {
            const idx = i + 1;
            const klass = idx < passo ? 'done' : (idx === passo ? 'current' : '');
            return (
              <React.Fragment key={lbl}>
                <div className="step-cell">
                  <div className={'step-node ' + klass}>{idx < passo ? '✓' : idx}</div>
                  <div className="step-label">{lbl.toUpperCase()}</div>
                </div>
                {i < labels.length - 1 && (
                  <div className={'step-conn' + (idx < passo ? ' done' : '')}></div>
                )}
              </React.Fragment>
            );
          })}
        </div>
      );
    }

    function TelaCriar({ onSalvarTreinar, onSalvar, onCancelar, preset, ratingUsuario }) {
      // Rating é decisão global (TelaInicio). Forçamos preset.rating =
      // ratingUsuario.valor pra ignorar valores antigos vindos da análise
      // chess.com (suggested_rating do adversário, etc).
      const ratingDoUsuario = (ratingUsuario && ratingUsuario.valor) || 1200;
      const presetForcado = Object.assign({}, preset || {}, { rating: ratingDoUsuario });
      const wz = useCriarConjunto({ preset: presetForcado, montarFn: montarConjunto });
      const {
        rating, setRating, variacao, setVariacao,
        temas, setTemas, toggleTema,
        tamanho, setTamanho, nome, setNome, nomeDefault, nomeFinal,
        montando, progresso, progPct, pieceLit, resultado, erro, setErro,
        montar,
      } = wz;

      // Disclosure de personalização. Aberto se veio com preset não-padrão
      // (ex: análise chess.com escolheu temas e tamanho específicos) ou se
      // o usuário tem temas selecionados.
      const presetEhCustom = preset && (
        (preset.temas && preset.temas.length > 0) ||
        (preset.variacao && preset.variacao !== 200)
      );
      const [personalizarAberto, setPersonalizarAberto] = useState(!!presetEhCustom);

      function aceitarESalvar(treinar) {
        const novo = {
          id: gerarId(),
          nome: nomeFinal,
          criado_em: Date.now(),
          rating, variacao,
          temas: temas.slice(),
          tamanho,
          tipo: (preset && preset.tipo) || 'padrao',
          username_referencia: (preset && preset.username_referencia) || null,
          puzzle_ids: resultado.puzzles.map(p => p.id || p.puzzleId),
          faixas_usadas: resultado.stats.faixas_usadas,
          range_efetivo: resultado.stats.range_efetivo
        };
        if (treinar) onSalvarTreinar(novo, resultado.puzzles);
        else onSalvar(novo, resultado.puzzles);
      }

      // Smith/Tikkanen presets — protocolos consagrados do método.
      // Cada um define tamanho + ciclos esperados + descrição. Variação e
      // temas continuam controlados pelo bloco "Personalizar".
      const presetsST = [
        { v: 100,  nome: 'Mini',     ciclos: '6 ciclos', tempo: '~2h por ciclo', desc: 'Pré-treino. Conjunto de aquecimento.' },
        { v: 300,  nome: 'Reduzido', ciclos: '7 ciclos', tempo: '~6h por ciclo', desc: 'Mínimo útil pra ver o efeito do método.' },
        { v: 500,  nome: 'Standard', ciclos: '7 ciclos', tempo: '~10h por ciclo', desc: 'Recomendado para profissionais.', rec: true },
        { v: 1000, nome: 'Full',     ciclos: '8 ciclos', tempo: '~20h por ciclo', desc: 'Protocolo do livro Woodpecker Method.' },
      ];

      return (
        <div className="tela-container">
          <div className="between mb-16">
            <div className="serif bold fs-17">Novo conjunto</div>
            {onCancelar && (
              <button className="btn btn-small ghost" onClick={onCancelar}>← Voltar</button>
            )}
          </div>

          <div className="card" style={{ borderRadius: 18 }}>
            {erro && (
              <div className="feedback-banner red mb-16">
                <div className="feedback-title">⚠ Erro ao montar</div>
                <div className="mono fs-12">{erro}</div>
              </div>
            )}

            {!resultado && !montando && (
              <div>
                {/* Rating fixo — definido na TelaInicio (calibragem ou chess.com) */}
                <div className="mono fs-10 ls-2 txt-muted mb-8">SEU RATING</div>
                <div className="hstack gap-12 mb-4" style={{ alignItems: 'baseline' }}>
                  <div className="num-display num-xl txt-primary">{formatarNumero(rating)}</div>
                  <div className="mono fs-12 txt-mid">{nivelDoRating(rating)}</div>
                </div>
                <div className="mono fs-11 txt-muted mb-20">
                  Puzzles de {formatarNumero(rating - variacao)} a {formatarNumero(rating + variacao)}
                </div>

                {/* Smith/Tikkanen presets */}
                <div className="mono fs-10 ls-2 txt-muted mb-8">PROTOCOLO</div>
                <div className="vstack gap-8 mb-20">
                  {presetsST.map(p => {
                    const ativo = tamanho === p.v;
                    return (
                      <button key={p.v}
                        className={'choice-card' + (ativo ? ' active' : '')}
                        onClick={() => setTamanho(p.v)}
                        style={ativo ? { borderColor: 'var(--primary)', background: 'var(--primary-bg)' } : null}>
                        <div className="hstack gap-12 between" style={{ alignItems: 'baseline', flexWrap: 'wrap' }}>
                          <div>
                            <span className="serif bold fs-15">{p.nome}</span>
                            {' '}
                            <span className="num fs-13 txt-mid">{p.v}×{p.ciclos.split(' ')[0]}</span>
                            {p.rec && (
                              <span className="badge primary" style={{ marginLeft: 8 }}>recomendado</span>
                            )}
                          </div>
                          <span className="mono fs-10 txt-muted">{p.tempo}</span>
                        </div>
                        <div className="serif fs-13 txt-mid mt-4">{p.desc}</div>
                      </button>
                    );
                  })}
                </div>

                {/* Personalização avançada (colapsável) */}
                <div className="mono fs-10 ls-2 txt-muted mb-8">
                  <button onClick={() => setPersonalizarAberto(a => !a)}
                    style={{
                      background: 'none', border: 'none', cursor: 'pointer', padding: 0,
                      color: 'var(--txt-muted)', font: 'inherit', letterSpacing: 'inherit'
                    }}>
                    {personalizarAberto ? '▾' : '▸'} PERSONALIZAR
                  </button>
                </div>
                {personalizarAberto && (
                  <div className="card-soft mb-16" style={{ padding: '14px 16px' }}>
                    <div className="input-label">Variação ±{variacao}</div>
                    <input className="slider mb-4" type="range" min="50" max="400" step="50"
                      value={variacao} onChange={e => setVariacao(parseInt(e.target.value))} />
                    <div className="mono fs-11 txt-muted mb-16">
                      Faixa: {formatarNumero(rating - variacao)} a {formatarNumero(rating + variacao)}
                    </div>

                    <div className="input-label">
                      Temas táticos {temas.length > 0 ? '(' + temas.length + ' selecionados)' : '· vazio = todos'}
                    </div>
                    <div className="tema-grid mb-16">
                      {Object.keys(TEMAS).map(k => (
                        <div key={k}
                          className={'tema-pill' + (temas.includes(k) ? ' active' : '')}
                          onClick={() => toggleTema(k)}>
                          {TEMAS[k]}
                        </div>
                      ))}
                    </div>

                    <div className="input-label">Nome do conjunto</div>
                    <input className="input-text" type="text"
                      value={nome} placeholder={nomeDefault}
                      onChange={e => setNome(e.target.value)} />
                  </div>
                )}

                <button className="btn btn-primary btn-block" onClick={montar}>
                  ♞ Montar conjunto
                </button>
              </div>
            )}

            {montando && (
              <div className="center">
                <div className="serif bold fs-15 mb-16">Montando seu conjunto...</div>
                <div className="progress-bar thin mb-12"><div className="progress-fill" style={{width: progPct + '%'}}></div></div>
                <div className="mono fs-12 txt-mid mb-16">{progresso}</div>
                <div className="pieces-row">
                  {['♔','♕','♖','♗','♘','♙'].map((p, i) => (
                    <span key={i} className={i < pieceLit ? 'piece-on' : 'piece-off'}>{p}</span>
                  ))}
                </div>
              </div>
            )}

            {resultado && (
              <div>
                {(() => {
                  const incompleto = resultado.puzzles.length < resultado.stats.tamanho_pedido;
                  const cls = incompleto ? 'feedback-banner red' : 'feedback-banner green';
                  return (
                <div className={cls + ' mb-16'} style={{ marginTop: 0 }}>
                  <div className="feedback-title">
                    {incompleto
                      ? '⚠ Apenas ' + resultado.puzzles.length + ' de ' + resultado.stats.tamanho_pedido + ' puzzles disponíveis'
                      : '✓ ' + resultado.puzzles.length + ' puzzles selecionados'}
                  </div>
                  <div className="mono fs-12 txt-mid mb-8">
                    Rating médio: {formatarNumero(resultado.stats.rating_medio)} · Faixas: {resultado.stats.faixas_usadas.join(', ').replace(/_/g, '–')}
                  </div>
                  {resultado.stats.expandido && (
                    <div className="mono fs-11 txt-amber mb-8">
                      Faixa expandida automaticamente: {formatarNumero(resultado.stats.range_efetivo.min)}–{formatarNumero(resultado.stats.range_efetivo.max)}
                    </div>
                  )}
                  <div className="hstack gap-6 flex-wrap">
                    {Object.entries(resultado.stats.dist_temas)
                      .sort((a,b)=>b[1]-a[1]).slice(0,5)
                      .map(([t, n]) => (
                        <span key={t} className="badge primary">{traduzirTema(t)} ({n})</span>
                      ))}
                  </div>
                </div>
                  );
                })()}
                <div className="vstack gap-10">
                  <button className="btn btn-primary btn-block" onClick={() => aceitarESalvar(true)}>
                    ▶ Iniciar Ciclo 1
                  </button>
                  <button className="btn btn-ghost btn-block" onClick={() => aceitarESalvar(false)}>
                    Salvar e treinar depois
                  </button>
                </div>
              </div>
            )}
          </div>

        </div>
      );
    }

    /* === TELA SELEÇÃO DE CICLO === */
    function TelaSelecao({ conjunto, ciclos, onIniciar, onVoltar }) {
      const cs = ciclosDoConjunto(ciclos, conjunto.id);
      const ult = cs.length ? cs[cs.length - 1] : null;
      const erros = ult ? (ult.total - ult.acertos) : 0;
      const proxNum = cs.length + 1;
      const [opcao, setOpcao] = useState('completo');

      const errosTemas = useMemo(() => {
        if (!ult) return [];
        const dist = {};
        for (const r of (ult.resultados || [])) {
          if (!r.correto && r.temas) {
            for (const t of r.temas) dist[t] = (dist[t] || 0) + 1;
          }
        }
        return Object.entries(dist).sort((a,b)=>b[1]-a[1]).slice(0,3);
      }, [ult]);

      // Espaçamento desde o último ciclo (consolidação por sono/repouso)
      const espacamento = useMemo(() => {
        if (!ult || !ult.data_fim) return null;
        const horas = (Date.now() - ult.data_fim) / 3600000;
        const tempoSubiu = cs.length >= 2
          && ult.tempo_medio_s > cs[cs.length - 2].tempo_medio_s;
        let texto, cor, recomenda;
        if (horas < 1) {
          cor = 'var(--red)';
          recomenda = 'Aguarde pelo menos 12h. A consolidação acontece com sono.';
          texto = 'há ' + Math.round(horas * 60) + ' min';
        } else if (horas < 12) {
          cor = 'var(--amber)';
          recomenda = tempoSubiu
            ? 'Tempo subiu no último ciclo — fadiga. Aguarde 24h.'
            : 'Cedo. O ideal é 12–24h entre ciclos para o método funcionar.';
          texto = 'há ' + Math.round(horas) + 'h';
        } else if (horas < 24) {
          cor = 'var(--gold)';
          recomenda = 'Bom intervalo. Pode iniciar agora se estiver descansado.';
          texto = 'há ' + Math.round(horas) + 'h';
        } else if (horas < 24 * 14) {
          cor = 'var(--green)';
          recomenda = 'Janela ideal — padrões consolidados, prosseguir.';
          texto = horas < 48 ? 'há 1 dia' : ('há ' + Math.round(horas / 24) + ' dias');
        } else {
          cor = 'var(--slate)';
          recomenda = 'Faz tempo — espere os primeiros puzzles serem mais lentos enquanto retoma.';
          texto = 'há ' + Math.round(horas / 24) + ' dias';
        }
        return { texto, cor, recomenda, horas };
      }, [ult, cs]);

      return (
        <div className="tela-container">
          <div className="card mb-12">
            <div className="serif bold fs-15 mb-4">{conjunto.nome}</div>
            <div className="mono fs-11 txt-muted">{cs.length} ciclos completados</div>
          </div>

          {espacamento && (
            <div className="card-soft mb-16" style={{ borderLeft: '3px solid ' + espacamento.cor }}>
              <div className="mono fs-10 ls-2 txt-muted mb-4">DESDE O ÚLTIMO CICLO</div>
              <div className="serif fs-13" style={{ color: espacamento.cor }}>
                <span className="bold">{espacamento.texto}</span>
              </div>
              <div className="mono fs-11 txt-mid mt-4">{espacamento.recomenda}</div>
            </div>
          )}

          <div className="vstack gap-12">
            <div
              onClick={() => setOpcao('completo')}
              style={{
                cursor: 'pointer',
                borderRadius: 12, padding: 18,
                background: opcao === 'completo' ? 'var(--primary-bg)' : 'var(--card)',
                border: '1px solid ' + (opcao === 'completo' ? 'var(--primary)' : 'var(--border)')
              }}>
              <div className="serif bold fs-15 mb-4">▶ Ciclo {proxNum} Completo</div>
              <div className="mono fs-12 txt-mid mb-4">Resolver todos os {conjunto.tamanho} puzzles</div>
              {ult && (
                <div className="mono fs-11 txt-muted">
                  Último: {Math.round((ult.acertos/ult.total)*100)}% acertos · {formatarTempo(ult.tempo_medio_s)} médio
                </div>
              )}
            </div>

            {ult && erros > 0 && (
              <div
                onClick={() => setOpcao('erros')}
                style={{
                  cursor: 'pointer',
                  borderRadius: 12, padding: 18,
                  background: opcao === 'erros' ? 'var(--primary-bg)' : 'var(--card)',
                  border: '1px solid ' + (opcao === 'erros' ? 'var(--primary)' : 'var(--border)')
                }}>
                <div className="serif bold fs-15 mb-4">🔁 Apenas Erros do Ciclo {ult.numero}</div>
                <div className="mono fs-12 txt-mid mb-8">Resolver os {erros} puzzles que errou</div>
                {errosTemas.length > 0 && (
                  <div className="hstack gap-6 flex-wrap">
                    {errosTemas.map(([t, n]) => (
                      <span key={t} className="badge red">{traduzirTema(t)} ({n})</span>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          <button className="btn btn-primary btn-block mt-24" onClick={() => onIniciar(opcao === 'erros')}>
            ▶ Iniciar
          </button>
          <div className="center mt-12">
            <button className="btn btn-ghost" onClick={onVoltar}>← Voltar</button>
          </div>
        </div>
      );
    }

    /* === HOOKS CUSTOMIZADOS === */

    // Timer encapsulado: tickeia a cada 1s quando 'rodando' E NÃO 'pausado'.
    // Retorna [seg, reset]. Sem stale-closure: o setInterval usa o updater
    // funcional (s => s + 1), e o useEffect refaz quando rodando/pausado mudam.
    /* useTimer, useTimerComPausa, useKeyboardShortcuts: src/hooks/ */

    /* === TELA TREINAR (EXECUÇÃO DO CICLO) ===
     * Versão pós-Fase 3b: toda a state machine do jogo (chess, drag, tap,
     * promo, modo confirmar, sessão) vive em src/hooks/useJogoPuzzle.js.
     * Aqui só temos JSX consumindo o hook + handlers triviais.
     */
    /* === RITUAL DE INÍCIO DE CICLO ===
     * Overlay antes do 1º puzzle de cada ciclo > 1. Mostra baseline,
     * meta, halving alvo e quote do livro. Cria momento de "começou
     * agora" antes de cair no flow do treino. */
    const QUOTES_WOODPECKER = [
      'Não é aprender. É gravar padrões na memória de longo prazo.',
      'Repetição até virar reflexo.',
      'O mesmo padrão, mais rápido a cada ciclo.',
      'Velocidade > acurácia. Padrão > cálculo.',
      'O alvo é halving: tempo total = 50% do Ciclo 1.',
    ];
    function RitualInicioCiclo({ ciclo, conjunto, ciclosAnteriores, onComecar }) {
      const baseline = ciclosAnteriores && ciclosAnteriores[0];
      const anterior = ciclosAnteriores && ciclosAnteriores[ciclosAnteriores.length - 1];
      if (!baseline) return null;
      const meta = anterior
        ? Math.max(Math.round(baseline.tempo_total_s * 0.5), Math.round(anterior.tempo_total_s * 0.85))
        : Math.round(baseline.tempo_total_s * 0.85);
      const halvingMeta = Math.round(baseline.tempo_total_s * 0.5);
      const quote = QUOTES_WOODPECKER[(ciclo.numero - 2) % QUOTES_WOODPECKER.length];

      return (
        <div className="modal-overlay" onClick={onComecar}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="mono fs-10 ls-2 txt-muted mb-4">{conjunto.nome}</div>
            <div className="serif bold fs-22 mb-16">Ciclo {ciclo.numero}</div>

            <div className="vstack gap-10 mb-20">
              <div className="hstack gap-8 between">
                <span className="serif fs-13">Baseline (Ciclo 1)</span>
                <span className="num bold fs-15">{formatarTempoLongo(baseline.tempo_total_s)}</span>
              </div>
              {anterior && anterior !== baseline && (
                <div className="hstack gap-8 between">
                  <span className="serif fs-13 txt-mid">Ciclo anterior</span>
                  <span className="num bold fs-13 txt-mid">{formatarTempoLongo(anterior.tempo_total_s)}</span>
                </div>
              )}
              <div className="hstack gap-8 between">
                <span className="serif fs-13 txt-primary">Meta deste ciclo</span>
                <span className="num bold fs-15 txt-primary">{formatarTempoLongo(meta)}</span>
              </div>
              <div className="hstack gap-8 between">
                <span className="serif fs-12 txt-muted">Halving (50% do baseline)</span>
                <span className="num fs-12 txt-muted">{formatarTempoLongo(halvingMeta)}</span>
              </div>
            </div>

            <div className="serif fs-13 txt-mid italic mb-20" style={{
              borderLeft: '3px solid var(--gold)', paddingLeft: 12, lineHeight: 1.55,
            }}>
              "{quote}"
            </div>

            <button className="btn btn-primary btn-block" onClick={onComecar}>
              Começar →
            </button>
          </div>
        </div>
      );
    }

    /* === BLOCO-DE-N (PAUSA DE BLOCO) ===
     * Modal leve a cada N puzzles dentro de um ciclo. Pausa cognitiva
     * curta. Em blocos pequenos (≤25) é micro-cerimônia (só pausa, sem
     * textarea). Em blocos grandes (≥50) abre espaço pra reflexão escrita.
     * Texto opcional, persiste no ciclo via onConcluir. */
    function ReflexaoModal({ posicao, total, blocoTamanho, onSalvar, onPular }) {
      const [texto, setTexto] = useState('');
      const eMicro = (blocoTamanho || 50) <= 25;
      return (
        <div className="modal-overlay">
          <div className="modal-card" style={{ maxWidth: 460 }}>
            <div className="mono fs-10 ls-2 txt-muted mb-4">
              {eMicro ? ('PAUSA · BLOCO DE ' + blocoTamanho) : ('PAUSA DE ' + (blocoTamanho || 50))}
            </div>
            <div className="serif bold fs-17 mb-4">{posicao} de {total}</div>
            <div className="serif fs-13 txt-mid mb-16">
              {eMicro
                ? 'Bloco fechado. Respire. Olhe pra longe por 10 segundos.'
                : 'Respire. O que você notou? Uma frase, opcional.'}
            </div>
            {!eMicro && (
              <textarea
                value={texto}
                onChange={e => setTexto(e.target.value)}
                autoFocus
                rows={2}
                placeholder="ex: muitos garfos com cavalo central..."
                style={{
                  width: '100%', resize: 'vertical',
                  background: 'var(--surface)', color: 'var(--txt)',
                  border: '1px solid var(--border)', borderRadius: 6,
                  padding: '8px 10px', fontFamily: 'var(--font-serif)', fontSize: 13,
                  lineHeight: 1.5, outline: 'none', marginBottom: 12,
                }} />
            )}
            <div className="hstack gap-8">
              <button className="btn btn-primary"
                style={{ flex: 1 }}
                onClick={() => onSalvar(texto.trim())}>
                {eMicro ? 'Continuar' : (texto.trim() ? 'Salvar e continuar' : 'Continuar')}
              </button>
              {!eMicro && (
                <button className="btn btn-ghost btn-small" onClick={onPular}>
                  Pular
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* === NOTAS INLINE (TelaTreinar) ===
     * Colapsável, fechado por default. Persiste em conjunto.notas via
     * onAtualizar do App. Save debounced em 600ms. Minimalista. */
    function NotasInline({ conjunto, onAtualizar }) {
      const [aberto, setAberto] = useState(false);
      const [texto, setTexto] = useState(conjunto.notas || '');
      const timerRef = useRef(null);
      useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);
      function aoMudar(v) {
        setTexto(v);
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => {
          onAtualizar({ ...conjunto, notas: v.trim() });
        }, 600);
      }
      const tem = (texto || '').trim().length > 0;
      return (
        <details className="notas-inline mt-12" open={aberto}
          onToggle={(e) => setAberto(e.target.open)}>
          <summary>
            <span>📝</span>
            <span>Notas{tem ? ' · ' + Math.min(texto.length, 80) + ' chars' : ''}</span>
            <span style={{ marginLeft: 'auto', opacity: 0.6 }}>
              {aberto ? '▾' : '▸'}
            </span>
          </summary>
          <textarea
            value={texto}
            onChange={e => aoMudar(e.target.value)}
            placeholder="Anote padrões, ideias, sensações sobre este conjunto..."
            rows={3} />
        </details>
      );
    }

    function TelaTreinar({ conjunto, ciclo, puzzles, sessao, ciclosAnteriores, onConcluir, onSalvarSessao, onSair, onAtualizarConjunto }) {
      // Reflexões a cada N — armazenadas localmente, injetadas em onConcluir
      // via ref (evita stale closure quando o hook chama o callback).
      const [reflexoesLocais, setReflexoesLocais] = useState(
        (sessao && sessao.reflexoes) || []
      );
      const reflexoesRef = useRef(reflexoesLocais);
      useEffect(() => { reflexoesRef.current = reflexoesLocais; }, [reflexoesLocais]);

      const j = useJogoPuzzle({
        puzzles: puzzles, sessao: sessao,
        conjunto: conjunto, ciclo: ciclo,
        ciclosAnteriores: ciclosAnteriores,
        onConcluirCiclo: (resultados) => onConcluir(resultados, { reflexoes: reflexoesRef.current }),
        onSalvarSessao: (s) => onSalvarSessao(Object.assign({}, s, { reflexoes: reflexoesRef.current })),
      });

      const {
        idx, total, puzzle, fenAtual, orientacao,
        resultados, tempoAcumulado, paceVsPuzzleBaseline, dicaVisao,
        estado, feedback, promoPicker, casaSelecionada, lancesPossiveis,
        ultimoLanceAdv, ultimoLanceErradoCoords, ultimoLanceJogadorTo,
        erroPuzzle, seg, pausado,
        onDrop, onSquareClick, aoIniciarDrag, aoEncerrarDrag,
        escolherPromocao, cancelarPromocao,
        pular, avancar, setPausado, pularPuzzleErro,
      } = j;

      // Pulso 700ms na borda do tabuleiro + na casa de destino quando
      // o feedback aparece. Reset entre puzzles via dependência em feedback.
      const [boardPulse, setBoardPulse] = useState(null);
      useEffect(() => {
        if (estado !== 'feedback' || !feedback) { setBoardPulse(null); return; }
        setBoardPulse(feedback.correto ? 'correct' : 'wrong');
        const t = setTimeout(() => setBoardPulse(null), 700);
        return () => clearTimeout(t);
      }, [estado, feedback]);

      useEffect(() => {
        if (!feedback || !window.WP || !window.WP.Audio) return;
        if (feedback.correto) window.WP.Audio.acerto();
        else if (!feedback.pulado) window.WP.Audio.erro();
      }, [feedback]);

      // Ritual de início: só pra ciclo > 1 (precisa de baseline) e só se
      // estamos começando do 0 (não retomando sessão no meio).
      const ehRetomada = sessao && sessao.index_atual > 0;
      const [mostraRitual, setMostraRitual] = useState(ciclo.numero > 1 && !ehRetomada);

      // Bloco-de-N: tamanho configurável via Chaves.BLOCO_TAMANHO (25/50/100,
      // default 50). Detecta quando resultados.length cruza múltiplo de N.
      const blocoTamanho = Store.get(Chaves.BLOCO_TAMANHO, 50);
      const [reflexaoPendente, setReflexaoPendente] = useState(null);
      const [posicoesVistas, setPosicoesVistas] = useState(new Set(
        ((sessao && sessao.reflexoes) || []).map(r => r.posicao)
      ));
      useEffect(() => {
        const n = resultados.length;
        if (n > 0 && n % blocoTamanho === 0 && !posicoesVistas.has(n) && estado === 'feedback') {
          setReflexaoPendente(n);
        }
      }, [resultados.length, estado, blocoTamanho]);

      function salvarReflexao(texto) {
        const pos = reflexaoPendente;
        if (texto) {
          setReflexoesLocais(reflexoesLocais.concat([{ posicao: pos, texto: texto, ts: Date.now() }]));
        }
        setPosicoesVistas(new Set(Array.from(posicoesVistas).concat([pos])));
        setReflexaoPendente(null);
      }
      function pularReflexao() {
        setPosicoesVistas(new Set(Array.from(posicoesVistas).concat([reflexaoPendente])));
        setReflexaoPendente(null);
      }

      if (!puzzle) return <div className="card center">Sem puzzles para treinar.</div>;
      if (erroPuzzle) {
        return (
          <div className="tela-container card" style={{ padding: 22 }}>
            <div className="feedback-banner red" style={{ marginTop: 0 }}>
              <div className="feedback-title">⚠ Falha ao carregar puzzle</div>
              <div className="mono fs-12">{erroPuzzle}</div>
            </div>
            <div className="hstack gap-10 mt-16" style={{ justifyContent: 'center' }}>
              <button className="btn btn-primary" onClick={pularPuzzleErro}
                disabled={idx + 1 >= total}>→ Pular puzzle</button>
              <button className="btn btn-ghost" onClick={onSair}>Sair</button>
            </div>
          </div>
        );
      }

      const boardId = 'board-' + (puzzle.id || puzzle.puzzleId || idx);

      // Tema instrutivo do puzzle (pra mostrar em acerto + erro 3+)
      const temas = puzzle.temas || puzzle.themes || [];
      const tInstrutivo = temas.find(t => TEMAS_INSTRUTIVOS.has(t));
      const explicacaoTema = tInstrutivo
        ? ((window.TacticalAggregator && window.TacticalAggregator.CANONICAL_THEMES &&
            window.TacticalAggregator.CANONICAL_THEMES[tInstrutivo]) || (TEMAS[tInstrutivo] || tInstrutivo))
        : null;

      // Quem joga (durante puzzle)
      const corTurno = (window.WP && window.WP.Puzzle && fenAtual)
        ? window.WP.Puzzle.corDoTabuleiro(fenAtual)
        : 'white';
      const labelTurno = corTurno === 'white' ? 'Brancas jogam' : 'Pretas jogam';

      return (
        <div className="tela-container narrow">
          {/* === STATUS BAR ÚNICA (1 linha sempre) === */}
          <div className="status-bar mb-12">
            <div className="group">
              <span className="num-display">{idx + 1}<span className="txt-muted">/{total}</span></span>
              <span className="sep">·</span>
              <span className="num-display" title="Tempo no puzzle atual"
                style={{ opacity: pausado ? 0.4 : 1 }}>
                {formatarTempo(seg)}
              </span>
              <span className="sep">·</span>
              <span className="num" title="Tempo total acumulado no ciclo"
                style={{ color: 'var(--txt-mid)' }}>
                {formatarTempo(tempoAcumulado)}
              </span>
            </div>
            <div className="group right">
              {paceVsPuzzleBaseline !== null && estado === 'jogando' && !pausado && (
                <span className="num" title="vs Ciclo 1 neste puzzle" style={{
                  color: paceVsPuzzleBaseline > 5
                    ? 'var(--red)'
                    : (paceVsPuzzleBaseline < -2 ? 'var(--green)' : 'var(--txt-muted)'),
                }}>
                  {paceVsPuzzleBaseline >= 0 ? '+' : '−'}{Math.abs(paceVsPuzzleBaseline)}s
                </span>
              )}
              {estado === 'jogando' && (
                <button
                  onClick={() => setPausado(p => !p)}
                  title={pausado ? 'Retomar (P)' : 'Pausar (P)'}
                  className="icon-btn">
                  {pausado ? '▶' : '⏸'}
                </button>
              )}
              <button className="icon-btn" onClick={onSair} title="Sair">✕</button>
            </div>
          </div>

          {/* === TABULEIRO === */}
          <div className={'board-wrap' + (boardPulse ? ' is-' + boardPulse : '')} style={{ margin: '0 auto' }}>
            <ChessBoardView
              key={boardId}
              boardId={boardId}
              fen={fenAtual}
              orientation={orientacao}
              onDrop={onDrop}
              onSquareClick={onSquareClick}
              onPickPiece={aoIniciarDrag}
              onDragEnd={aoEncerrarDrag}
              draggable={estado === 'jogando' && !pausado}
              highlightFrom={ultimoLanceAdv ? ultimoLanceAdv.from : null}
              highlightTo={ultimoLanceAdv ? ultimoLanceAdv.to : null}
              selectedSquare={casaSelecionada}
              errorFrom={ultimoLanceErradoCoords ? ultimoLanceErradoCoords.from : null}
              errorTo={ultimoLanceErradoCoords ? ultimoLanceErradoCoords.to : null}
              successTo={estado === 'feedback' && feedback && feedback.correto ? ultimoLanceJogadorTo : null}
              possibleMoves={lancesPossiveis ? lancesPossiveis.dots : null}
              possibleCaptures={lancesPossiveis ? lancesPossiveis.captures : null}
            />
          </div>

          {/* Visão por dica: sussurro discreto após 3 erros históricos. */}
          {dicaVisao && estado === 'jogando' && (
            <div className="mono fs-11 mt-8 center" style={{
              color: 'var(--txt-muted)', letterSpacing: '0.04em', fontStyle: 'italic'
            }}>
              👁 olhe pra peça em <span className="bold" style={{ color: 'var(--txt-mid)' }}>{dicaVisao.casa}</span>
              <span className="txt-muted"> · {dicaVisao.erros} erros antes</span>
            </div>
          )}

          {/* === BOTÃO PRINCIPAL (sempre visível) === */}
          <div className="mt-16">
            {estado === 'jogando' ? (
              <button className="btn btn-ghost btn-block" onClick={pular}
                disabled={pausado}
                title="Pular puzzle (espaço)">
                ⏭ Pular
              </button>
            ) : (
              <button className="btn btn-primary btn-block" onClick={avancar}>
                {idx + 1 >= total ? '🏁 Finalizar ciclo' : '→ Próximo'}
              </button>
            )}
          </div>

          {/* === ZONA FIXA: turno (durante) ↔ feedback (após) === */}
          <div className={'mt-12' + (estado === 'feedback' && feedback ? ' action-zone feedback-mode' : ' action-zone')}>
            {estado === 'jogando' && (
              <div className="turn-indicator">
                <span className={'turn-dot ' + corTurno}></span>
                <span className="turn-label">{labelTurno}</span>
                {puzzle.rating && (
                  <span className="txt-muted" style={{ marginLeft: 4 }}>
                    · puzzle {puzzle.rating}
                  </span>
                )}
              </div>
            )}
            {estado === 'feedback' && feedback && (
              <div style={{ width: '100%' }}>
                {feedback.correto ? (
                  /* === ACERTO === Linha 1: ✓ [★] tema · Linha 2: SANs */
                  <div className="feedback-banner green" style={{ marginTop: 0 }}>
                    <div className="feedback-title hstack gap-8 flex-wrap" style={{ alignItems: 'baseline' }}>
                      <span>✓</span>
                      {feedback.visao_instantanea && (
                        <span className="badge amber" title="Cada lance resolvido em ≤3s">★ vi de cara</span>
                      )}
                      {explicacaoTema && (
                        <span className="serif fs-13 txt-mid" style={{ fontWeight: 'normal' }}>
                          {explicacaoTema}
                        </span>
                      )}
                    </div>
                    {(feedback.sans || []).length > 0 && (
                      <div className="hstack gap-6 flex-wrap mt-4">
                        {(feedback.sans || []).map((s, i) => (
                          <span key={i} className="badge">{s}</span>
                        ))}
                      </div>
                    )}
                  </div>
                ) : feedback.mostrar_solucao ? (
                  /* === ERRO 3+ === Linha 1: ✗ Nº erro — solução SANs · Linha 2: tema */
                  <div className="feedback-banner red" style={{ marginTop: 0, borderLeft: '3px solid var(--amber)' }}>
                    <div className="feedback-title hstack gap-6 flex-wrap" style={{ alignItems: 'baseline' }}>
                      <span>{feedback.pulado ? '⏭' : '✗'} {feedback.total_erros}º erro · solução:</span>
                      {(feedback.sans || []).map((s, i) => (
                        <span key={i} className="badge">{s}</span>
                      ))}
                    </div>
                    {explicacaoTema && (
                      <div className="serif fs-13 txt-mid mt-4" style={{ lineHeight: 1.4 }}>
                        {explicacaoTema}
                      </div>
                    )}
                  </div>
                ) : (
                  /* === ERRO 1-2 === Linha 1: ✗ errou — próximo · Linha 2: Nº erro · solução no 3º */
                  <div className="feedback-banner red" style={{ marginTop: 0 }}>
                    <div className="feedback-title">
                      {feedback.pulado ? '⏭ pulado' : '✗ errou'} — próximo
                    </div>
                    <div className="mono fs-10 txt-muted mt-4">
                      {feedback.total_erros}º erro · solução revelada no 3º
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* === NOTAS DO CONJUNTO (colapsável, minimalista) === */}
          {onAtualizarConjunto && (
            <NotasInline conjunto={conjunto} onAtualizar={onAtualizarConjunto} />
          )}

          <Promocao
            promoPicker={promoPicker}
            onEscolher={escolherPromocao}
            onCancelar={cancelarPromocao}
          />

          {mostraRitual && (
            <RitualInicioCiclo
              ciclo={ciclo}
              conjunto={conjunto}
              ciclosAnteriores={ciclosAnteriores}
              onComecar={() => setMostraRitual(false)} />
          )}

          {reflexaoPendente !== null && (
            <ReflexaoModal
              posicao={reflexaoPendente}
              total={total}
              blocoTamanho={blocoTamanho}
              onSalvar={salvarReflexao}
              onPular={pularReflexao} />
          )}
        </div>
      );
    }

    /* === TELA CONCLUSÃO === */
    function TelaConclusao({ conjunto, ciclo, ciclosAnteriores, onProximoCiclo, onApenasErros, onEvolucao, onCriarComRating, onConcluirConjunto, onCalibrar, onExcluirConjunto }) {
      const Conjunto = window.WP.Conjunto;
      const ehFimOnboarding = !!conjunto.eh_onboarding && ciclo.numero >= 3;
      // Verifica se o conjunto está pronto pra concluir DEPOIS deste
      // ciclo (passa ciclo final junto, simulando lista atual).
      const ciclosComEsse = ciclosAnteriores.concat([ciclo]);
      const statusConcluir = Conjunto.prontoPraConcluir(conjunto, ciclosComEsse);
      const total = ciclo.total;
      const acertos = ciclo.acertos;
      const erros = ciclo.erros;
      const taxaAcerto = total ? Math.round((acertos / total) * 100) : 0;
      const tempoMedio = ciclo.tempo_medio_s;
      const tempoTotal = ciclo.tempo_total_s;

      const anterior = ciclosAnteriores.length >= 2 ? ciclosAnteriores[ciclosAnteriores.length - 2] : null;
      // Baseline = ciclo 1 (referência do método). Em ciclo 2 baseline === anterior.
      const baseline = (ciclosAnteriores.length >= 2 && ciclo.numero > 1) ? ciclosAnteriores[0] : null;
      const baselineDistinto = baseline && anterior && baseline !== anterior;
      const razaoBaseline = baseline ? (ciclo.tempo_total_s / baseline.tempo_total_s) : 1;
      // Meta sugerida pro próximo ciclo: 15% abaixo do atual, mas nunca abaixo do halving (50% do baseline).
      const metaProximo = baseline
        ? Math.max(Math.round(baseline.tempo_total_s * 0.5), Math.round(ciclo.tempo_total_s * 0.85))
        : Math.round(ciclo.tempo_total_s * 0.85);
      const halvingAtingido = baseline && razaoBaseline <= 0.5;

      const dataLabel = useMemo(() => {
        const d = new Date(ciclo.data_fim || Date.now());
        return d.toLocaleString('pt-BR');
      }, [ciclo.data_fim]);

      const errosTemas = useMemo(() => {
        const dist = {};
        for (const r of (ciclo.resultados || [])) {
          if (!r.correto && r.temas) {
            for (const t of r.temas) dist[t] = (dist[t] || 0) + 1;
          }
        }
        return Object.entries(dist).sort((a,b)=>b[1]-a[1]).slice(0,3);
      }, [ciclo]);

      const sugestao = useMemo(() => {
        if (!anterior) {
          return {
            cor: 'var(--primary)',
            texto: 'Ciclo 1 concluído! Esse é seu tempo de referência. Objetivo: bater esse tempo no Ciclo 2.'
          };
        }
        const dPct = anterior.tempo_medio_s ? ((tempoMedio - anterior.tempo_medio_s) / anterior.tempo_medio_s) * 100 : 0;
        if (dPct < -20) {
          return {
            cor: 'var(--green)',
            texto: 'Excelente! Seu tempo caiu ' + Math.abs(Math.round(dPct)) + '% — o método está funcionando.'
          };
        }
        if (dPct > 5) {
          return {
            cor: 'var(--slate)',
            texto: 'Descanse antes do próximo ciclo. A fadiga afeta a tática.'
          };
        }
        const errPct = errosTemas.length && total ? (errosTemas[0][1] / total) * 100 : 0;
        if (errPct > 35) {
          return {
            cor: 'var(--amber)',
            texto: 'Atenção: muitos erros em ' + traduzirTema(errosTemas[0][0]) + '. Crie um conjunto focado.'
          };
        }
        return {
          cor: 'var(--primary)',
          texto: 'Ciclo concluído. Continue mantendo o ritmo no próximo ciclo.'
        };
      }, [anterior, tempoMedio, errosTemas, total]);

      function delta(antes, depois, formatador) {
        const d = depois - antes;
        const pct = antes ? Math.round((d / antes) * 100) : 0;
        return { d, pct, formatador };
      }

      const ehCalibracao = !!(conjunto && conjunto.calibracao);
      const ratingSugerido = ehCalibracao ? calcularRatingSugerido(ciclo) : null;

      return (
        <div className="tela-container">
          <div className="center serif bold fs-22 mb-4">
            {ehCalibracao ? '🎯 Calibração Concluída!' : '🎉 Ciclo ' + ciclo.numero + ' Concluído!'}
          </div>
          <div className="center mono fs-11 txt-muted mb-20">{conjunto.nome} · {dataLabel}</div>

          {ehCalibracao && ratingSugerido !== null && (
            <div className="card mb-16" style={{ borderTop: '4px solid var(--primary)' }}>
              <div className="mono fs-10 ls-2 txt-muted mb-4">RATING SUGERIDO</div>
              <div className="num-display num-xl txt-primary">{formatarNumero(ratingSugerido)}</div>
              <div className="mono fs-11 txt-mid mt-4">
                Nível: {nivelDoRating(ratingSugerido)}
              </div>
              <div className="serif fs-13 txt-mid mt-12" style={{ lineHeight: 1.6 }}>
                Baseado em {acertos} acertos de {total} puzzles ({taxaAcerto}%) na faixa 600–2200.
                {' '}Esse rating te coloca em puzzles que você resolve em ~50% das vezes — onde o método rende mais.
              </div>
              {onCriarComRating && (
                <button className="btn btn-primary btn-block mt-16"
                  onClick={() => onCriarComRating(ratingSugerido)}>
                  ▶ Criar conjunto com rating {ratingSugerido}
                </button>
              )}
            </div>
          )}

          <div className="metric-grid mb-16">
            <div className="metric-card">
              <div className="metric-label">TOTAL</div>
              <div className="metric-value">{total} puzzles</div>
            </div>
            <div className="metric-card green">
              <div className="metric-label">ACERTOS</div>
              <div className="metric-value">{acertos} ({taxaAcerto}%)</div>
            </div>
            <div className="metric-card slate">
              <div className="metric-label">TEMPO TOTAL</div>
              <div className="metric-value">{formatarTempoLongo(tempoTotal)}</div>
            </div>
            <div className="metric-card gold">
              <div className="metric-label">TEMPO MÉDIO</div>
              <div className="metric-value">{formatarTempo(tempoMedio)}</div>
            </div>
          </div>

          {baseline && (
            <div className="card-soft mb-16">
              <div className="mono fs-10 ls-2 txt-muted mb-8">VS CICLO 1 (BASELINE)</div>
              <div className="vstack gap-6 mono fs-13">
                {(() => {
                  const tDelta = ciclo.tempo_total_s - baseline.tempo_total_s;
                  const tPct = baseline.tempo_total_s ? Math.round((tDelta / baseline.tempo_total_s) * 100) : 0;
                  const tCor = tDelta < 0 ? 'var(--green)' : 'var(--red)';
                  const tSeta = tDelta < 0 ? '↓' : '↑';
                  return (
                    <div>
                      Tempo total: {formatarTempoLongo(baseline.tempo_total_s)} → <span className="bold">{formatarTempoLongo(ciclo.tempo_total_s)}</span>
                      <span style={{color: tCor, marginLeft: 8}}>{tSeta} {Math.abs(tPct)}%</span>
                    </div>
                  );
                })()}
                {(() => {
                  const mDelta = tempoMedio - baseline.tempo_medio_s;
                  const mPct = baseline.tempo_medio_s ? Math.round((mDelta / baseline.tempo_medio_s) * 100) : 0;
                  const mCor = mDelta < 0 ? 'var(--green)' : 'var(--red)';
                  const mSeta = mDelta < 0 ? '↓' : '↑';
                  return (
                    <div>
                      Tempo médio: {formatarTempo(baseline.tempo_medio_s)} → <span className="bold">{formatarTempo(tempoMedio)}</span>
                      <span style={{color: mCor, marginLeft: 8}}>{mSeta} {Math.abs(mPct)}%</span>
                    </div>
                  );
                })()}
                <div className="hstack gap-8 flex-wrap mt-8" style={{ alignItems: 'center' }}>
                  <span className="badge" style={{

    /* === COMPONENTE GRÁFICO (Chart.js) === */
    function GraficoCanvas({ tipo, data, opcoes, height }) {
      const ref = useRef(null);
      const chartRef = useRef(null);
      useEffect(() => {
        if (!ref.current) return;
        chartRef.current = new Chart(ref.current.getContext('2d'), {
          type: tipo,
          data,
          options: opcoes
        });
        return () => {
          if (chartRef.current) chartRef.current.destroy();
        };
      }, []);
      useEffect(() => {
        if (!chartRef.current) return;
        chartRef.current.data = data;
        chartRef.current.options = opcoes;
        chartRef.current.update();
      }, [data, opcoes]);
      return <canvas ref={ref} style={{ width: '100%', maxHeight: (height || 220) + 'px' }} height={height || 220}></canvas>;
    }

    /* corCss: lib/wp-helpers.js */

    /* === TELA EVOLUÇÃO === */
    // Sparkline SVG mini do tempo do puzzle ao longo dos ciclos.
    // Pontos vermelhos em erro, verdes em acerto. Linha conectando os
    // tempos. Diferencia "ficou rápido" (linha desce) de "decorou"
    // (linha estável após erro). Largura adaptável.
    function SparklineTeimoso({ historico, width, height }) {
      width = width || 80;
      height = height || 22;
      if (!historico || historico.length < 2) return null;
      const tempos = historico.map(h => h.tempo_s || 0);
      const maxT = Math.max.apply(null, tempos) || 1;
      const stepX = width / (historico.length - 1);
      const ptos = historico.map((h, i) => {
        const x = i * stepX;
        const y = height - (h.tempo_s / maxT) * (height - 4) - 2;
        return { x: x, y: y, correto: h.correto };
      });
      const path = ptos.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
      return (
        <svg width={width} height={height} style={{ display: 'block', overflow: 'visible' }}>
          <path d={path} fill="none" stroke="var(--txt-muted)" strokeWidth="1" />
          {ptos.map((p, i) => (
            <circle key={i} cx={p.x} cy={p.y} r="2.2"
              fill={p.correto ? 'var(--green)' : 'var(--red)'} />
          ))}
        </svg>
      );
    }

    function LinhaTeimoso({ t }) {
      const [aberto, setAberto] = useState(false);
      const acertos = t.historico.filter(h => h.correto).length;
      const totalAttempts = t.historico.length;

      const corBordaEsq = ultimoCorreto ? 'var(--green)' : 'var(--red)';

      return (
        <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 8, borderLeft: '3px solid ' + corBordaEsq, overflow: 'hidden' }}>
          <div className="hstack gap-8 flex-wrap" onClick={() => setAberto(a => !a)}

    /* === HEATMAP POR TEMA ===
     * Tabela tema × ciclo com taxa de acerto por célula. Verde alto,
     * gold médio, vermelho baixo. Mostra evolução de fluência por
     * padrão tático ao longo da repetição. */
    function HeatmapTemas({ cs }) {
      const matriz = useMemo(() => {
        const temasSet = new Set();
        for (const c of cs) {
          for (const r of (c.resultados || [])) {
            for (const t of (r.temas || [])) {
              if (TEMAS_INSTRUTIVOS.has(t)) temasSet.add(t);
            }
          }
        }
        const temas = Array.from(temasSet);
        const out = temas.map(t => {
          const ciclos = cs.map(c => {
            let ok = 0, total = 0;
            for (const r of (c.resultados || [])) {
              if ((r.temas || []).includes(t)) {
                total += 1;
                if (r.correto) ok += 1;
              }
            }
            return { numero: c.numero, ok, total, taxa: total > 0 ? ok / total : null };
          });
          const totalGeral = ciclos.reduce((s, x) => s + x.total, 0);
          return { tema: t, ciclos: ciclos, totalGeral: totalGeral };
        });
        out.sort((a, b) => b.totalGeral - a.totalGeral);
        // Filtra temas com pouquíssimo sinal (< 5 ocorrências totais)
        return out.filter(r => r.totalGeral >= 5).slice(0, 8);
      }, [cs]);

      if (matriz.length === 0 || cs.length === 0) return null;

      const corCelula = (taxa) => {
        if (taxa == null) return 'transparent';
        if (taxa >= 0.7) return 'var(--green)';
        if (taxa >= 0.4) return 'var(--gold)';
        return 'var(--red)';
      };

      return (
        <div className="card mb-12">
          <div className="serif bold fs-13 mb-4">🔥 Heatmap por tema</div>
          <div className="mono fs-11 txt-muted mb-12">
            Taxa de acerto por tema em cada ciclo. Verde ≥ 70% · gold 40-70% · vermelho &lt; 40%.
          </div>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ borderCollapse: 'separate', borderSpacing: 2, minWidth: 'fit-content' }}>
              <thead>
                <tr>
                  <th></th>
                  {cs.map(c => (
                    <th key={c.numero} className="mono fs-10 txt-muted" style={{ padding: '4px 6px', fontWeight: 600 }}>
                      C{c.numero}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {matriz.map(row => (
                  <tr key={row.tema}>
                    <td className="serif fs-12 txt-mid" style={{ paddingRight: 10, whiteSpace: 'nowrap' }}>
                      {TEMAS[row.tema] || row.tema}
                    </td>
                    {row.ciclos.map((cell, i) => (
                      <td key={i}
                        title={cell.total + ' puzzles · ' + cell.ok + ' acertos' +
                               (cell.taxa != null ? ' (' + Math.round(cell.taxa * 100) + '%)' : '')}
                        style={{
                          background: corCelula(cell.taxa),
                          opacity: cell.total === 0 ? 0.15 : (cell.total < 3 ? 0.5 : 1),
                          width: 30, height: 26, padding: 0,
                          borderRadius: 3, textAlign: 'center', verticalAlign: 'middle',
                        }}>
                        <span className="mono fs-10" style={{
                          color: cell.total > 0 ? '#fff' : 'var(--txt-muted)',
                          fontWeight: 600,
                        }}>
                          {cell.total > 0 ? Math.round(cell.taxa * 100) : '—'}
                        </span>
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    /* === COMPARADOR DE CICLOS ===
     * Selecione 2 ciclos. Mostra top 5 melhorias e top 5 piorias por
     * puzzle (delta de tempo entre ciclos B e A). */
    function ComparadorCiclos({ cs }) {
      const [aIdx, setAIdx] = useState(Math.max(0, cs.length - 2));
      const [bIdx, setBIdx] = useState(cs.length - 1);
      if (cs.length < 2) return null;
      const a = cs[aIdx];
      const b = cs[bIdx];
      if (!a || !b || aIdx === bIdx) return null;

      const ta = {}, tb = {}, ra = {}, rb = {};
      for (const r of (a.resultados || [])) {
        ta[r.puzzle_id] = r.tempo_s || 0;
        ra[r.puzzle_id] = r.correto;
      }
      for (const r of (b.resultados || [])) {
        tb[r.puzzle_id] = r.tempo_s || 0;
        rb[r.puzzle_id] = r.correto;
      }
      const comuns = Object.keys(ta).filter(id => id in tb && ra[id] && rb[id]);
      const deltas = comuns.map(id => ({
        id: id, ta: ta[id], tb: tb[id], delta: tb[id] - ta[id]
      }));
      const melhorias = deltas.slice().sort((x, y) => x.delta - y.delta).filter(d => d.delta < 0).slice(0, 5);
      const piorias  = deltas.slice().sort((x, y) => y.delta - x.delta).filter(d => d.delta > 0).slice(0, 5);

      const Linha = ({ d, isPior }) => (
        <div className="hstack gap-8 flex-wrap" style={{
          padding: '4px 8px', fontSize: 11,
          background: 'var(--surface)', borderRadius: 4,
        }}>
          <span className="mono txt-muted">#{d.id}</span>
          <span className="num" style={{ marginLeft: 'auto' }}>
            {formatarTempo(d.ta)} → <span className="bold">{formatarTempo(d.tb)}</span>
          </span>
          <span className="num bold" style={{
            color: isPior ? 'var(--red)' : 'var(--green)', minWidth: 50, textAlign: 'right',
          }}>
            {d.delta > 0 ? '+' : ''}{d.delta}s
          </span>
        </div>
      );

      return (
        <div className="card mb-12">
          <div className="serif bold fs-13 mb-4">🔄 Comparador de ciclos</div>
          <div className="mono fs-11 txt-muted mb-12">
            Maiores diferenças por puzzle (só conta puzzles acertados em ambos os ciclos).
          </div>
          <div className="hstack gap-12 mb-16 flex-wrap">
            <div>
              <div className="input-label">Ciclo A</div>
              <select value={aIdx} onChange={e => setAIdx(parseInt(e.target.value))}
                style={{
                  background: 'var(--surface)', color: 'var(--txt)',
                  border: '1px solid var(--border)', borderRadius: 6,
                  padding: '6px 10px', fontFamily: 'var(--font-mono)', fontSize: 12,
                }}>
                {cs.map((c, i) => <option key={i} value={i}>Ciclo {c.numero}</option>)}
              </select>
            </div>
            <span className="serif fs-15 txt-muted" style={{ alignSelf: 'flex-end', paddingBottom: 6 }}>vs</span>
            <div>
              <div className="input-label">Ciclo B</div>
              <select value={bIdx} onChange={e => setBIdx(parseInt(e.target.value))}
                style={{
                  background: 'var(--surface)', color: 'var(--txt)',
                  border: '1px solid var(--border)', borderRadius: 6,
                  padding: '6px 10px', fontFamily: 'var(--font-mono)', fontSize: 12,
                }}>
                {cs.map((c, i) => <option key={i} value={i}>Ciclo {c.numero}</option>)}
              </select>
            </div>
          </div>

          <div className="hstack gap-12 flex-wrap" style={{ alignItems: 'flex-start' }}>
            <div style={{ flex: '1 1 220px', minWidth: 0 }}>
              <div className="mono fs-10 ls-2 txt-green mb-8">▼ MAIORES MELHORIAS</div>
              <div className="vstack gap-4">
                {melhorias.length === 0
                  ? <div className="mono fs-11 txt-muted italic">— nenhuma —</div>
                  : melhorias.map(d => <Linha key={d.id} d={d} isPior={false} />)}
              </div>
            </div>
            <div style={{ flex: '1 1 220px', minWidth: 0 }}>
              <div className="mono fs-10 ls-2 txt-red mb-8">▲ MAIORES PIORIAS</div>
              <div className="vstack gap-4">
                {piorias.length === 0
                  ? <div className="mono fs-11 txt-muted italic">— nenhuma —</div>
                  : piorias.map(d => <Linha key={d.id} d={d} isPior={true} />)}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* === YEAR-IN-REVIEW ===
     * Card destacado quando >= 365 dias passaram desde o 1º ciclo do
     * usuário (qualquer conjunto). Stats agregadas. Aparece no topo da
     * TelaEvolucao. */
    function YearInReview({ ciclos, conjuntos }) {
      const dados = useMemo(() => {
        if (!ciclos || ciclos.length === 0) return null;
        const ord = ciclos.slice().filter(c => c.data_fim).sort((a, b) => a.data_fim - b.data_fim);
        if (ord.length === 0) return null;
        const primeiro = ord[0];
        const dias = (Date.now() - primeiro.data_fim) / 86400000;
        if (dias < 365) return null;
        const anos = Math.floor(dias / 365);
        const totalCiclos = ciclos.length;
        const totalPuzzles = ciclos.reduce((s, c) => s + ((c.resultados || []).length), 0);
        const acertos = ciclos.reduce((s, c) => s + ((c.resultados || []).filter(r => r.correto).length), 0);
        const taxaAcerto = totalPuzzles > 0 ? Math.round((acertos / totalPuzzles) * 100) : 0;
        const idsUnicos = new Set();
        for (const c of ciclos) {
          for (const r of (c.resultados || [])) idsUnicos.add(r.puzzle_id);
        }
        return {
          anos: anos,
          totalCiclos: totalCiclos,
          totalConjuntos: conjuntos ? conjuntos.length : 0,
          totalPuzzles: totalPuzzles,
          puzzlesUnicos: idsUnicos.size,
          taxaAcerto: taxaAcerto,
        };
      }, [ciclos, conjuntos]);
      if (!dados) return null;

      return (
        <div className="card mb-16" style={{ borderTop: '3px solid var(--gold)' }}>
          <div className="mono fs-10 ls-2 txt-muted mb-4">RESUMO</div>
          <div className="serif bold fs-22 mb-12">
            {dados.anos} ano{dados.anos > 1 ? 's' : ''} de Woodpecker
          </div>
          <div className="metric-grid">
            <div className="metric-card gold">
              <div className="metric-label">CICLOS</div>
              <div className="metric-value num">{dados.totalCiclos}</div>
            </div>
            <div className="metric-card">
              <div className="metric-label">CONJUNTOS</div>
              <div className="metric-value num">{dados.totalConjuntos}</div>
            </div>
            <div className="metric-card green">
              <div className="metric-label">PUZZLES RESOLVIDOS</div>
              <div className="metric-value num">{formatarNumero(dados.totalPuzzles)}</div>
            </div>
            <div className="metric-card slate">
              <div className="metric-label">PUZZLES ÚNICOS</div>
              <div className="metric-value num">{formatarNumero(dados.puzzlesUnicos)}</div>
            </div>
          </div>
          <div className="mono fs-11 txt-muted mt-12">
            Taxa de acerto agregada: <span className="num bold">{dados.taxaAcerto}%</span>
          </div>
        </div>
      );
    }

    // Aba "Total": agregado de TODOS os conjuntos e ciclos (ativos +
    // concluídos). Mostra volume, taxa, tempo, conjuntos e top temas
    // de erro cross-conjunto.
    function AbaTotal({ conjuntos, ciclos }) {
      const atividade = useMemo(() => metricasAtividade(ciclos), [ciclos]);
      const dados = useMemo(() => {
        const totalCiclos = ciclos.length;
        const totalPuzzles = ciclos.reduce((s, c) => s + ((c.resultados || []).length), 0);
        const acertos = ciclos.reduce((s, c) => s + ((c.resultados || []).filter(r => r.correto).length), 0);
        const tempoTotal = ciclos.reduce((s, c) => s + (c.tempo_total_s || 0), 0);
        const taxaAcerto = totalPuzzles > 0 ? Math.round((acertos / totalPuzzles) * 100) : 0;
        const idsUnicos = new Set();
        for (const c of ciclos) for (const r of (c.resultados || [])) idsUnicos.add(r.puzzle_id);
        const dist = {};
        for (const c of ciclos) {
          for (const r of (c.resultados || [])) {
            if (!r.correto && r.temas) {
              for (const t of r.temas) dist[t] = (dist[t] || 0) + 1;
            }
          }
        }
        const topErros = Object.entries(dist).sort((a,b)=>b[1]-a[1]).slice(0, 5);
        return {
          totalCiclos: totalCiclos, totalPuzzles: totalPuzzles, tempoTotal: tempoTotal,
          taxaAcerto: taxaAcerto, puzzlesUnicos: idsUnicos.size, topErros: topErros,
          conjuntosAtivos: conjuntos.filter(c => !c.concluido).length,
          conjuntosConcluidos: conjuntos.filter(c => !!c.concluido).length,
        };
      }, [conjuntos, ciclos]);

      if (dados.totalCiclos === 0) {
        return (
          <div className="card center">
            <div className="serif fs-13 txt-muted">Nenhum ciclo completado ainda.</div>
          </div>
        );
      }

      return (
        <div className="vstack gap-14">
          {/* Atividade + streak — eram da TelaInicio antes da onda 5 */}
          <div className="card-soft">
            <div className="hstack gap-12 flex-wrap" style={{ justifyContent: 'space-between' }}>
              <div>
                <div className="mono fs-10 ls-2 txt-muted">ATIVIDADE</div>
                <div className="serif bold fs-15">
                  {atividade.total} ciclo{atividade.total > 1 ? 's' : ''} · {atividade.diasAtivos} dia{atividade.diasAtivos > 1 ? 's' : ''} ativo{atividade.diasAtivos > 1 ? 's' : ''}
                </div>
              </div>
              <div className="mono fs-11 txt-muted center">
                {atividade.diasDesde !== null && (
                  atividade.diasDesde < 1
                    ? 'Última: há ' + Math.round(atividade.diasDesde * 24) + 'h'
                    : 'Última: há ' + Math.round(atividade.diasDesde) + ' dia' + (Math.round(atividade.diasDesde) > 1 ? 's' : '')
                )}
              </div>
            </div>
          </div>

          <CalendarioStreak ciclos={ciclos} dias={84} />

          <div className="card">
            <div className="metric-grid">
              <div className="metric-card">
                <div className="metric-label">CICLOS TOTAIS</div>
                <div className="metric-value num">{dados.totalCiclos}</div>
              </div>
              <div className="metric-card green">
                <div className="metric-label">PUZZLES RESOLVIDOS</div>
                <div className="metric-value num">{formatarNumero(dados.totalPuzzles)}</div>
              </div>
              <div className="metric-card slate">
                <div className="metric-label">PUZZLES ÚNICOS</div>
                <div className="metric-value num">{formatarNumero(dados.puzzlesUnicos)}</div>
              </div>
              <div className="metric-card gold">
                <div className="metric-label">TAXA AGREGADA</div>
                <div className="metric-value num">{dados.taxaAcerto}%</div>
              </div>
            </div>
            <div className="mono fs-11 txt-muted mt-12">
              Tempo total · <span className="num bold">{formatarTempoLongo(dados.tempoTotal)}</span>
              {' · '}Conjuntos · <span className="num bold">{dados.conjuntosAtivos}</span> ativos,
              {' '}<span className="num bold">{dados.conjuntosConcluidos}</span> concluídos
            </div>
          </div>

          {dados.topErros.length > 0 && (
            <div className="card">
              <div className="serif bold fs-13 mb-8">⚠ Temas críticos (todos os conjuntos)</div>
              <div className="vstack gap-6">
                {dados.topErros.map(([tema, n]) => (
                  <div key={tema} className="hstack gap-8" style={{
                    padding: '6px 10px', background: 'var(--surface)',
                    border: '1px solid var(--border)', borderRadius: 6,
                  }}>
                    <span className="serif fs-12">{traduzirTema(tema)}</span>
                    <span className="mono fs-11 txt-muted" style={{ marginLeft: 'auto' }}>{n} erros</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Aba "Por tipo": agrupa conjuntos pelos 3 tipos canônicos (padrão,
    // pessoal, adversário). Mostra volume e taxa de acerto separados por
    // tipo, pra responder "qual tipo de treino mais rendeu pra mim?".
    function AbaPorTipo({ conjuntos, ciclos }) {
      const Conjunto = window.WP.Conjunto;
      const tipos = ['padrao', 'pessoal', 'adversario'];

      const porTipo = useMemo(() => {
        const out = {};
        for (const t of tipos) {
          out[t] = { ativos: [], concluidos: [], ciclos: [], puzzles: 0, acertos: 0, tempoTotal: 0 };
        }
        for (const c of conjuntos) {
          const t = Conjunto.tipoDe(c);
          if (!out[t]) continue;
          if (c.concluido) out[t].concluidos.push(c);
          else out[t].ativos.push(c);
        }
        for (const cic of ciclos) {
          const c = conjuntos.find(x => x.id === cic.conjunto_id);
          if (!c) continue;
          const t = Conjunto.tipoDe(c);
          if (!out[t]) continue;
          out[t].ciclos.push(cic);
          const res = cic.resultados || [];
          out[t].puzzles += res.length;
          out[t].acertos += res.filter(r => r.correto).length;
          out[t].tempoTotal += cic.tempo_total_s || 0;
        }
        return out;
      }, [conjuntos, ciclos]);

      return (
        <div className="vstack gap-14">
          {tipos.map(t => {
            const d = porTipo[t];
            const taxa = d.puzzles ? Math.round((d.acertos / d.puzzles) * 100) : 0;
            return (
              <div key={t} className="card">
                <div className="hstack gap-8 mb-12" style={{ alignItems: 'center' }}>
                  <span className="fs-22">{Conjunto.ICONES_TIPOS[t]}</span>
                  <span className="serif bold fs-15">{Conjunto.NOMES_TIPOS[t]}</span>
                  <span className="mono fs-11 txt-muted" style={{ marginLeft: 'auto' }}>
                    {d.ativos.length} ativo{d.ativos.length !== 1 ? 's' : ''}
                    {' · '}{d.concluidos.length} concluído{d.concluidos.length !== 1 ? 's' : ''}
                  </span>
                </div>
                {d.ciclos.length === 0 ? (
                  <div className="serif fs-12 txt-muted">Sem ciclos completados deste tipo.</div>
                ) : (
                  <div className="metric-grid">
                    <div className="metric-card">
                      <div className="metric-label">CICLOS</div>
                      <div className="metric-value num">{d.ciclos.length}</div>
                    </div>
                    <div className="metric-card green">
                      <div className="metric-label">TAXA</div>
                      <div className="metric-value num">{taxa}%</div>
                    </div>
                    <div className="metric-card slate">
                      <div className="metric-label">PUZZLES</div>
                      <div className="metric-value num">{formatarNumero(d.puzzles)}</div>
                    </div>
                    <div className="metric-card gold">
                      <div className="metric-label">TEMPO TOTAL</div>
                      <div className="metric-value num" style={{ fontSize: 14 }}>{formatarTempoLongo(d.tempoTotal)}</div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function TelaEvolucao({ conjuntos, ciclos, conjuntoInicial, onVoltar, onCriarFocado }) {
      // Default 'individual' quando vem de conjunto específico (clicar
      // em "ver evolução" do banner do TelaInicio); 'total' quando entra
      // pela TelaInicio sem contexto.
      const [aba, setAba] = useState(conjuntoInicial ? 'individual' : 'total');
      const [conjuntoId, setConjuntoId] = useState(
        conjuntoInicial ? conjuntoInicial.id : (conjuntos[0] && conjuntos[0].id) || null
      );
      const conjunto = conjuntos.find(c => c.id === conjuntoId);
      const cs = conjuntoId ? ciclosDoConjunto(ciclos, conjuntoId) : [];

      const cpr = corCss('--primary');
      const cgr = corCss('--green');
      const cam = corCss('--amber');
      const cre = corCss('--red');
      const csu = corCss('--surface');
      const ctxt = corCss('--txt-mid');
      const cbdr = corCss('--border');

      const optsBase = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          x: { ticks: { color: ctxt }, grid: { color: cbdr } },
          y: { ticks: { color: ctxt }, grid: { color: cbdr }, beginAtZero: true }
        }
      };

      const dataTempoMedio = useMemo(() => ({
        labels: cs.map(c => 'C' + c.numero),
        datasets: [{
          data: cs.map(c => c.tempo_medio_s),
          borderColor: cpr, backgroundColor: cpr,
          fill: false, tension: 0.2, pointRadius: 4, pointBackgroundColor: cpr
        }]
      }), [cs, cpr]);

      const dataTaxa = useMemo(() => ({
        labels: cs.map(c => 'C' + c.numero),
        datasets: [{
          data: cs.map(c => c.total ? Math.round((c.acertos/c.total)*100) : 0),
          backgroundColor: cgr,
          borderColor: cgr,
          borderRadius: 4
        }]
      }), [cs, cgr]);

      const errosPorTema = useMemo(() => {
        const dist = {};
        for (const c of cs) {
          for (const r of (c.resultados || [])) {
            if (!r.correto && r.temas) {
              for (const t of r.temas) dist[t] = (dist[t] || 0) + 1;
            }
          }
        }
        return Object.entries(dist).sort((a,b)=>b[1]-a[1]).slice(0,8);
      }, [cs]);

      // Mapa de puzzles com histórico completo. Base pra teimosos e
      // personal worst — só percorremos cs uma vez.
      const puzzleHistorico = useMemo(() => {
        const porId = {};
        for (const c of cs) {
          for (const r of (c.resultados || [])) {
            if (!porId[r.puzzle_id]) {
              porId[r.puzzle_id] = {
                id: r.puzzle_id,
                historico: [],
                temas: r.temas || [],
                rating: r.rating
              };
            }
            porId[r.puzzle_id].historico.push({
              ciclo: c.numero,
              correto: !!r.correto,
              tempo_s: r.tempo_s || 0
            });
            if ((r.temas || []).length > 0) porId[r.puzzle_id].temas = r.temas;
            if (r.rating) porId[r.puzzle_id].rating = r.rating;
          }
        }
        return Object.values(porId);
      }, [cs]);

      // Puzzles teimosos: errados em ≥2 ciclos.
      const teimosos = useMemo(() => {
        return puzzleHistorico
          .map(p => ({ ...p, count: p.historico.filter(h => !h.correto).length }))
          .filter(p => p.count >= 2)
          .sort((a, b) => b.count - a.count || b.historico.length - a.historico.length)
          .slice(0, 12);
      }, [puzzleHistorico]);

      // Personal Worst: top 10 por tempo total agregado (sum tempo_s
      // em todos os ciclos). Pode ser ponto cego ou só puzzle complexo
      // — usuário decide. Filtra puzzles vistos em ≥ 2 ciclos pra ter
      // sinal estável.
      const personalWorst = useMemo(() => {
        return puzzleHistorico
          .map(p => ({
            ...p,
            tempoTotal: p.historico.reduce((a, h) => a + (h.tempo_s || 0), 0),
            n: p.historico.length,
          }))
          .filter(p => p.n >= 2)
          .sort((a, b) => b.tempoTotal - a.tempoTotal)
          .slice(0, 10);
      }, [puzzleHistorico]);

      const dataErros = useMemo(() => {
        const max = errosPorTema.length ? errosPorTema[0][1] : 1;
        return {
          labels: errosPorTema.map(([t]) => traduzirTema(t)),
          datasets: [{
            data: errosPorTema.map(([_, n]) => n),
            backgroundColor: errosPorTema.map(([_, n]) => n / max > 0.6 ? cre : cam),
            borderRadius: 4
          }]
        };
      }, [errosPorTema, cre, cam]);

      const dataTempoTotal = useMemo(() => ({
        labels: cs.map(c => 'C' + c.numero),
        datasets: [{
          data: cs.map(c => Math.round(c.tempo_total_s / 60)),
          backgroundColor: csu,
          borderColor: cpr,
          borderWidth: 1.5,
          borderRadius: 4
        }]
      }), [cs, csu, cpr]);

      // Fadiga intra-ciclo: tempo por puzzle dentro do ciclo mais recente.
      // Aplica média móvel (janela 10) pra suavizar o ruído quando o conjunto é grande.
      const fadigaIntra = useMemo(() => {
        const ult = cs[cs.length - 1];
        if (!ult || !ult.resultados || ult.resultados.length < 30) return null;
        const tempos = ult.resultados.map(r => r.tempo_s || 0);
        const janela = Math.max(5, Math.round(tempos.length / 30));
        const suavizado = tempos.map((_, i) => {
          const start = Math.max(0, i - janela + 1);
          const slice = tempos.slice(start, i + 1);
          return Math.round(slice.reduce((a, b) => a + b, 0) / slice.length);
        });
        // Tendência: média dos primeiros 20% vs últimos 20%
        const corte = Math.max(1, Math.floor(tempos.length * 0.2));
        const inicio = tempos.slice(0, corte).reduce((a,b) => a + b, 0) / corte;
        const fim = tempos.slice(-corte).reduce((a,b) => a + b, 0) / corte;
        const subiuPct = inicio ? Math.round(((fim - inicio) / inicio) * 100) : 0;
        return {
          ciclo: ult.numero,
          n: tempos.length,
          subiuPct,
          data: {
            labels: suavizado.map((_, i) => i + 1),
            datasets: [{
              data: suavizado,
              borderColor: subiuPct > 20 ? cre : cpr,
              backgroundColor: subiuPct > 20 ? cre : cpr,
              fill: false,
              tension: 0.3,
              pointRadius: 0,
              borderWidth: 2
            }]
          }
        };
      }, [cs, cpr, cre]);

      // Resumo
      const ultimo = cs.length ? cs[cs.length - 1] : null;
      const primeiro = cs.length ? cs[0] : null;
      const melhorTaxa = cs.length ? Math.max(...cs.map(c => c.total ? Math.round((c.acertos/c.total)*100) : 0)) : 0;
      const reducaoTempo = (primeiro && ultimo && primeiro.tempo_medio_s)
        ? Math.round(((ultimo.tempo_medio_s - primeiro.tempo_medio_s) / primeiro.tempo_medio_s) * 100)
        : 0;
      const minEconomizado = (primeiro && ultimo) ? Math.max(0, Math.round((primeiro.tempo_total_s - ultimo.tempo_total_s) / 60)) : 0;
      const temaCritico = errosPorTema[0] ? traduzirTema(errosPorTema[0][0]) : '—';

      let status = { label: 'Estável →', klass: 'badge', cor: 'var(--slate)' };
      if (reducaoTempo < -10) status = { label: 'Em Evolução ↑', klass: 'badge green' };
      else if (reducaoTempo > 10) status = { label: 'Regressão ↓', klass: 'badge red' };

      return (
        <div className="tela-container wide">
          <div className="between mb-16">
            <div className="serif bold fs-17">📊 Evolução</div>
            {onVoltar && <button className="btn btn-small ghost" onClick={onVoltar}>← Voltar</button>}
          </div>

          {/* Year-in-review é cross-conjunto: aparece no topo se aplicável */}
          <YearInReview ciclos={ciclos} conjuntos={conjuntos} />

          {conjuntos.length === 0 ? (
            <div className="card center">
              <div className="serif fs-13 txt-muted">Crie um conjunto e complete pelo menos 2 ciclos para visualizar a evolução.</div>
            </div>
          ) : (
            <div>
              {/* Abas: Total · Por tipo · Individual */}
              <div className="center mb-16">
                <div className="segmented">
                  <button className={aba === 'total' ? 'active' : ''} onClick={() => setAba('total')}>TOTAL</button>
                  <button className={aba === 'por-tipo' ? 'active' : ''} onClick={() => setAba('por-tipo')}>POR TIPO</button>
                  <button className={aba === 'individual' ? 'active' : ''} onClick={() => setAba('individual')}>INDIVIDUAL</button>
                </div>
              </div>

              {aba === 'total' && <AbaTotal conjuntos={conjuntos} ciclos={ciclos} />}
              {aba === 'por-tipo' && <AbaPorTipo conjuntos={conjuntos} ciclos={ciclos} />}

              {aba === 'individual' && (
                <div>
              {conjuntos.length > 1 && (
                <div className="card-soft mb-16">
                  <div className="input-label">CONJUNTO</div>
                  <select value={conjuntoId || ''} onChange={e => setConjuntoId(e.target.value)}
                    style={{
                      width: '100%', background: 'var(--card)', color: 'var(--txt)',
                      border: '1px solid var(--border)', borderRadius: 6,
                      padding: '8px 10px', fontFamily: "'Courier New', monospace", fontSize: 13
                    }}>
                    {conjuntos.map(c => (
                      <option key={c.id} value={c.id}>{c.nome}{c.concluido ? ' (concluído)' : ''}</option>
                    ))}
                  </select>
                </div>
              )}

              {cs.length < 2 ? (
                <div className="card center">
                  <div className="serif fs-13 txt-mid">Complete 2 ciclos para ver a evolução.</div>
                  <div className="mono fs-11 txt-muted mt-8">Ciclos atuais: {cs.length}</div>
                </div>
              ) : (
                <div className="vstack gap-14">
                  <div className="card">
                    <div className="serif bold fs-13 mb-8">⏱ Tempo Médio por Puzzle (s)</div>
                    <div style={{ height: 220 }}>
                      <GraficoCanvas tipo="line" data={dataTempoMedio} opcoes={optsBase} />
                    </div>
                  </div>

                  <div className="card">
                    <div className="serif bold fs-13 mb-8">🎯 Taxa de Acerto por Ciclo (%)</div>
                    <div style={{ height: 220 }}>
                      <GraficoCanvas tipo="bar" data={dataTaxa}
                        opcoes={{ ...optsBase, scales: { ...optsBase.scales, y: { ...optsBase.scales.y, max: 100 } } }} />
                    </div>
                  </div>

                  {errosPorTema.length > 0 && (
                    <div className="card">
                      <div className="serif bold fs-13 mb-8">⚠ Erros por Tema (acumulado)</div>
                      <div style={{ height: Math.max(180, errosPorTema.length * 30) }}>
                        <GraficoCanvas tipo="bar" data={dataErros}
                          opcoes={{ ...optsBase, indexAxis: 'y' }} />
                      </div>
                      {onCriarFocado && (
                        <div className="mt-12">
                          <button className="btn btn-small ghost" onClick={() => onCriarFocado(errosPorTema[0][0], conjunto)}>
                            ＋ Criar conjunto focado em "{traduzirTema(errosPorTema[0][0])}" ({errosPorTema[0][1]} erros)
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                  {fadigaIntra && (
                    <div className="card">
